[env]
extra_scripts = pre:extra_scripts/generate_protocol.py
check_tool = cppcheck
check_src_filters = 
  +<src/APP/*>
  +<src/DEV/*>
  +<src/IO/*>
  +<src/Library/*>
  +<src/Main/*>
check_flags =
  cppcheck: --addon=misra.json
  cppcheck: --addon=cert.py
lib_archive = no
build_src_filter=
  +<Main/>
  +<APP/>
  +<DEV/>
  +<HAL/Include/>
  +<IO/>
  -<IO/generated/>
  +<Library/>
  +<Generated/>
build_flags=
  -Isrc/Main
  -Isrc/APP
  -Isrc/DEV
  -Isrc/DEV/Config
  -Isrc/HAL/Include
  -Isrc/IO
  -Isrc/IO/Config
  -Isrc/Library
  -Isrc/HAL/config
  -Isrc/Generated

[env:propeller2]
platform = platform-propeller
board = EdgeModule
framework = flexcc
build_flags=
  ${env.build_flags}
  -Isrc/HAL/P2
  -Isrc/HW/P2
  -D__WORKSPACE__='"${platformio.workspace_dir}/../"'
  -DSD_CARD_MOUNT_PATH='"/sd"'
upload_protocol = flash
upload_speed=2000000
monitor_speed=230400
build_src_filter =
  ${env.build_src_filter}
  +<HAL/P2/>
  +<HW/P2/>

[env:propeller2_debug]
extends = env:propeller2
build_flags=
  ${env:propeller2.build_flags}
  -DENABLE_DEBUG_SERIAL=1

[env:propeller2_release]
extends = env:propeller2

[env:native_emulator]
; Builds firmware C code as a static library (libfirmware.a) for the Rust SIL emulator.
; Excludes Main/main.c — Rust provides HAL implementations and the entry point.
; The emulator calls mad_begin() from Main/MaD.c directly.
platform = native
extra_scripts =
  ${env.extra_scripts}
  post:extra_scripts/archive_lib.py
build_flags =
  ${env.build_flags}
  -Isrc/HW/Native
  -D__EMULATION__
  -DENABLE_DEBUG_SERIAL=1
  -DSD_CARD_MOUNT_PATH='"./sd"'
  -DPROPELLER_NATIVE=0
  -DPROPELLER_FRAMEWORK=0
  -DP2LLVM=1
  -DFLEXCC=2
  -Wall
  -g
  -std=c99
  -Wno-unused-parameter
  -Wno-sign-compare
build_src_filter =
  ${env.build_src_filter}
  -<Main/main.c>

[env:native_test]
platform = native
test_build_src = true
build_flags =
  ${env.build_flags}
  -Isrc/HW/Native
  -D__EMULATION__
  -DENABLE_DEBUG_SERIAL=1
  -DMOUNT_PATH='"./sd"'
  -DSD_CARD_MOUNT_PATH='"./test/sd/"'
  -DPROPELLER_NATIVE=0
  -DPROPELLER_FRAMEWORK=0
  -DP2LLVM=1
  -DFLEXCC=2
  -Wall
  -g
  -fstack-protector-all
  -fsanitize=address
build_src_filter =
  +<DEV/watchdog.c>
  +<DEV/dev_nvram.c>
  +<DEV/Config/dev_nvram_config.c>
  +<Library/>
  +<HAL/Include/>