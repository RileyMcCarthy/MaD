name: Deploy docs + MaD Control (GitHub Pages)

# Publishes a single Pages deployment that serves the documentation site at the
# repo root and MaD Control under /app/:
#   https://<owner>.github.io/<repo>/        → docs (MkDocs Material, from docs/)
#   https://<owner>.github.io/<repo>/app/    → MaD Control (Vite PWA)
#
# Triggers: push to main (docs/app/protocol changes), a manual run, or a
# `madcontrol-v*` release tag. Tags must match Software/Control/package.json
# (enforced below); cut them with Software/Control/scripts/release.sh.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Software/Control/**'
      - 'Protocol/**'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
    tags:
      - 'madcontrol-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer releases supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json

      # Fail the release rather than ship a build whose About page / bug reports
      # still say the previous package.json version.
      - name: Assert madcontrol-v* tag matches package.json
        run: bash Software/Control/scripts/release.sh --check

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python deps (protocol generator + docs)
        run: |
          pip install -r Protocol/ProtoEmb/core/requirements.txt
          pip install -r docs/requirements.txt

      # ── Build MaD Control (served under /<repo>/app/) ──
      - name: Install app dependencies
        working-directory: Software/Control
        run: npm ci

      - name: Build wasm + generated protocol bindings
        working-directory: Software/Control
        run: |
          npm run build:wasm
          npm run generate:proto

      # Project Pages serve under /<repo>/; the app lives under /<repo>/app/.
      # HashRouter means client routing needs no server rewrites.
      - name: Build the app (Pages base path)
        working-directory: Software/Control
        run: |
          npx tsc -b
          npx vite build --base="/${{ github.event.repository.name }}/app/"

      # ── Build the docs (served at /<repo>/) and merge the app under /app ──
      - name: Build the documentation site
        run: mkdocs build --strict

      - name: Assemble Pages bundle (docs at root, app at /app)
        run: |
          mkdir -p site/app
          cp -r Software/Control/dist/. site/app/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Named GitHub Release so MaD Control shows up next to firmware/hardware
  # instead of only as a Pages deploy. Notes-only — the app is the Pages URL.
  release:
    name: GitHub Release (MaD Control)
    if: startsWith(github.ref, 'refs/tags/madcontrol-v')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get version
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/madcontrol-v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: MaD Control ${{ steps.ver.outputs.VERSION }}
          tag_name: madcontrol-v${{ steps.ver.outputs.VERSION }}
          generate_release_notes: true
          body: |
            MaD Control **${{ steps.ver.outputs.VERSION }}** is live at
            https://rileymccarthy.github.io/MaD/app/

            Browser app (Chrome/Edge). Nothing to install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
