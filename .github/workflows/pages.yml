name: Deploy web app (GitHub Pages)

# Release process: push a tag like `webapp-v1.2.3` to publish that commit to
# GitHub Pages. `workflow_dispatch` allows a manual deploy of any branch.
on:
  push:
    tags:
      - 'webapp-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer releases supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/MaDWasmControl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/MaDWasmControl/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Build wasm + generated protocol bindings
        run: |
          npm run build:wasm
          npm run generate:proto

      # Project Pages serve under /<repo>/, so the bundle must use that base.
      # HashRouter means client routing needs no server rewrites.
      - name: Build PWA (Pages base path)
        run: |
          npx tsc -b
          npx vite build --base="/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Software/MaDWasmControl/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
