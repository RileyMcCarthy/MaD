name: Deploy docs + MaD Control (GitHub Pages)

# One Pages deployment serves the documentation site and every MaD Control
# release side by side:
#   https://<owner>.github.io/<repo>/              docs (MkDocs Material, from main)
#   https://<owner>.github.io/<repo>/app/          redirects to the latest release
#   https://<owner>.github.io/<repo>/app/vX.Y.Z/   one release, frozen as it shipped
#
# A release is built once, when its madcontrol-vX.Y.Z tag is pushed: the
# `release-app` job builds the app for its own folder and attaches it to the
# GitHub release as mad-control-vX.Y.Z.zip. Every deploy then re-assembles the
# site from main's docs plus those zips (tools/assemble-pages-app.mts), so
# merging to main never changes a published app. The github-pages environment
# only accepts main, so the tag job asks main to redeploy rather than deploying
# itself. Cut releases with Software/Control/scripts/release.sh.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Software/Control/tools/assemble-pages-app.mts'
      - '.github/workflows/pages.yml'
    tags:
      - 'madcontrol-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Tag-only: fail if madcontrol-vX.Y.Z != Software/Control/package.json.
  check:
    if: startsWith(github.ref, 'refs/tags/madcontrol-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Assert madcontrol-v* tag matches package.json
        run: bash Software/Control/scripts/release.sh --check

  # Tag-only: build this release for /<repo>/app/vX.Y.Z/, publish it as a
  # GitHub release asset, then have main redeploy the site with it.
  release-app:
    name: GitHub Release (MaD Control)
    if: startsWith(github.ref, 'refs/tags/madcontrol-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get version
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/madcontrol-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python deps (protocol generator)
        run: pip install -r Protocol/ProtoEmb/core/requirements.txt

      - name: Install app dependencies
        working-directory: Software/Control
        run: npm ci

      - name: Build wasm + generated protocol bindings
        working-directory: Software/Control
        run: |
          npm run build:wasm
          npm run generate:proto

      # The firmware default is not bundled per release: the site serves the
      # latest firmware release once, at /app/firmware/, for every version.
      - name: Build the app for its release folder
        working-directory: Software/Control
        env:
          MAD_FIRMWARE_RELEASE: 'off'
        run: |
          npx tsc -b
          npx vite build --base="/${{ github.event.repository.name }}/app/v${{ steps.ver.outputs.VERSION }}/"
          (cd dist && zip -qr "../mad-control-v${{ steps.ver.outputs.VERSION }}.zip" .)

      - uses: softprops/action-gh-release@v3
        with:
          name: MaD Control ${{ steps.ver.outputs.VERSION }}
          tag_name: madcontrol-v${{ steps.ver.outputs.VERSION }}
          files: Software/Control/mad-control-v${{ steps.ver.outputs.VERSION }}.zip
          generate_release_notes: true
          body: |
            MaD Control **${{ steps.ver.outputs.VERSION }}** runs at
            https://rileymccarthy.github.io/MaD/app/v${{ steps.ver.outputs.VERSION }}/
            (https://rileymccarthy.github.io/MaD/app/ always opens the latest release).

            Browser app (Chrome/Edge). Nothing to install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Redeploy the site with this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python deps (docs)
        run: pip install -r docs/requirements.txt

      # mkdocs empties site/ first, so it runs before the app is added.
      - name: Build the documentation site
        run: mkdocs build --strict

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json

      - name: Install tooling dependencies
        working-directory: Software/Control
        run: npm ci --ignore-scripts

      # Every released app version, the redirect to the latest, versions.json
      # and the shared latest firmware. Fails (and so does not deploy) when no
      # release carries a build yet.
      - name: Assemble the released apps under /app
        working-directory: Software/Control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAD_REPO: ${{ github.repository }}
          MAD_FIRMWARE_REPO: ${{ github.repository }}
          OUT: ${{ github.workspace }}/site/app
        run: npx vite-node tools/assemble-pages-app.mts

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
