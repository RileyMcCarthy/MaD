name: Deploy docs + app (GitHub Pages)

# Publishes a single Pages deployment that serves the documentation site at the
# repo root and the control app under /app/:
#   https://<owner>.github.io/<repo>/        → docs (MkDocs Material, from docs/)
#   https://<owner>.github.io/<repo>/app/    → MaDWasmControl (Vite PWA)
#
# Triggers: push to main (docs/app/protocol changes), a manual run, or a
# `webapp-v*` release tag.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Software/MaDWasmControl/**'
      - 'Protocol/**'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
    tags:
      - 'webapp-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer releases supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/MaDWasmControl/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python deps (protocol generator + docs)
        run: |
          pip install -r Protocol/ProtoEmb/core/requirements.txt
          pip install -r docs/requirements.txt

      # ── Build the control app (served under /<repo>/app/) ──
      - name: Install app dependencies
        working-directory: Software/MaDWasmControl
        run: npm ci

      - name: Build wasm + generated protocol bindings
        working-directory: Software/MaDWasmControl
        run: |
          npm run build:wasm
          npm run generate:proto

      # Project Pages serve under /<repo>/; the app lives under /<repo>/app/.
      # HashRouter means client routing needs no server rewrites.
      - name: Build the app (Pages base path)
        working-directory: Software/MaDWasmControl
        run: |
          npx tsc -b
          npx vite build --base="/${{ github.event.repository.name }}/app/"

      # ── Build the docs (served at /<repo>/) and merge the app under /app ──
      - name: Build the documentation site
        run: mkdocs build --strict

      - name: Assemble Pages bundle (docs at root, app at /app)
        run: |
          mkdir -p site/app
          cp -r Software/MaDWasmControl/dist/. site/app/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
