name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Software/MaDControl/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Software/MaDControl/**'

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      working-directory: ./Software/MaDControl
      run: npm ci

    - name: Install Playwright Browsers and Dependencies
      working-directory: ./Software/MaDControl
      run: |
        npx playwright install --with-deps
        # Install Xvfb for headless Electron testing and socat for serial emulation
        sudo apt-get update
        sudo apt-get install -y xvfb socat

    - name: Install PlatformIO CLI
      run: |
        # Install PlatformIO CLI for firmware emulation
        pip install platformio

    - name: Setup firmware emulation
      working-directory: ./Firmware/MaDCore/Emulation
      run: |
        # Use the makefile to create venv and install dependencies
        make venv

    - name: Start firmware emulator
      run: |
        # Create virtual serial port pair
        socat -d -d pty,raw,echo=0,link=/tmp/tty.rpi_client pty,raw,echo=0,link=/tmp/tty.rpi &
        echo $! > /tmp/socat.pid
        # Wait for virtual serial ports to be created
        sleep 2
        # Start firmware emulator in background
        cd Firmware/MaDCore/Emulation
        nohup make run > /tmp/firmware-emulator.log 2>&1 &
        echo $! > /tmp/firmware.pid
        # Give emulator time to start
        sleep 5
        echo "Firmware emulator started, logs available in /tmp/firmware-emulator.log"

    - name: Build application
      working-directory: ./Software/MaDControl
      run: npm run build

    - name: Run Playwright tests
      working-directory: ./Software/MaDControl
      run: |
        # Start Xvfb and run tests
        DISPLAY=:99 xvfb-run --server-args="-screen 0 1280x960x24" npx playwright test
      env:
        CI: true

    - name: Create artifact directories
      run: |
        mkdir -p /tmp/artifacts/Logs
        mkdir -p /tmp/artifacts/Screenshots
        # Copy firmware emulator logs
        cp /tmp/firmware-emulator.log /tmp/artifacts/Logs/ || echo "No firmware log found"

    - name: Copy screenshots to artifact directory
      working-directory: ./Software/MaDControl
      run: |
        # Copy all screenshots from test results
        find test-results/ -name "*.png" -exec cp {} /tmp/artifacts/Screenshots/ \; || echo "No screenshots found"

    - name: Upload test results and screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results-${{ github.run_number }}
        path: /tmp/artifacts/
        retention-days: 30