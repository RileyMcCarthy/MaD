name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Software/MaDControl/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Software/MaDControl/**'

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      working-directory: ./Software/MaDControl
      run: npm ci

    - name: Install Playwright Browsers and Dependencies
      working-directory: ./Software/MaDControl
      run: |
        npx playwright install --with-deps
        # Install Xvfb for headless Electron testing and socat for serial emulation
        sudo apt-get update
        sudo apt-get install -y xvfb socat

    - name: Setup firmware emulation
      working-directory: ./Firmware/MaDCore/Emulation
      run: |
        # Use the makefile to create venv and install dependencies
        make venv

    - name: Build application
      working-directory: ./Software/MaDControl
      run: |
        npm run build
        # Ensure preload script is available for development mode testing
        mkdir -p .erb/dll
        cp release/app/dist/main/preload.js .erb/dll/preload.js
        # Also copy to release location for Electron app testing
        mkdir -p release/app/.erb/dll
        cp release/app/dist/main/preload.js release/app/.erb/dll/preload.js

    - name: Run Playwright tests
      working-directory: ./Software/MaDControl
      run: |
        # Start Xvfb and run tests
        DISPLAY=:99 xvfb-run --server-args="-screen 0 1280x960x24" npx playwright test
      env:
        CI: true

    - name: Upload test results and screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results-${{ github.run_number }}
        path: |
          Software/MaDControl/test-results/
          Software/MaDControl/playwright-report/
        retention-days: 30