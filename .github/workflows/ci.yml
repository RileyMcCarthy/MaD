name: CI

on:
  push:
    paths:
      - 'Software/**'
      - 'Firmware/**'
      - 'Hardware/**'
      # Submodule pin bumps land as gitlink changes at Protocol/ProtoEmb and
      # SIL/embsim; .gitmodules changes repoint the submodule URLs.
      - 'Protocol/**'
      - 'SIL/**'
      - '.gitmodules'
      # The docs site is built with `mkdocs build --strict` here as well as in
      # pages.yml, so a broken nav/link fails the PR instead of the deploy.
      - 'docs/**'
      - 'mkdocs.yml'
    tags:
      - 'firmware-v*'
      - 'hardware-v*'
  # Run on every PR (no path filter) so the aggregating "CI Gate" check below
  # always reports a status. Required status checks that never run would block a
  # PR forever; the per-component jobs are still gated by the `changes` job, so a
  # docs-only PR just skips them and the gate passes in seconds.
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  # Determine which components need to be built based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.changes.outputs.firmware }}
      hardware: ${{ steps.changes.outputs.hardware }}
      wasm_control: ${{ steps.changes.outputs.wasm_control }}
      protocol: ${{ steps.changes.outputs.protocol }}
      sil: ${{ steps.changes.outputs.sil }}
      docs: ${{ steps.changes.outputs.docs }}
      embsim_pin: ${{ steps.changes.outputs.embsim_pin }}
      protoemb_pin: ${{ steps.changes.outputs.protoemb_pin }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
      is_firmware_release: ${{ startsWith(github.ref, 'refs/tags/firmware-v') }}
      is_hardware_release: ${{ startsWith(github.ref, 'refs/tags/hardware-v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            firmware:
              - 'Firmware/**'
            hardware:
              - 'Hardware/**'
            wasm_control:
              - 'Software/Control/**'
              - 'Protocol/**'
              - '.gitmodules'
            protocol:
              - 'Protocol/**'
              - '.gitmodules'
            sil:
              - 'SIL/**'
              - 'Firmware/**'
              - 'Protocol/**'
              - '.gitmodules'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
            # Submodule PIN bumps only — the gitlink entry itself, not the
            # surrounding tree. `sil`/`protocol` above fire on any change under
            # SIL/ or Protocol/; these two fire only when the recorded commit
            # moves, which is when the expensive upstream-mirror legs earn their
            # keep. `.gitmodules` is included because repointing a submodule URL
            # changes which repository the pin resolves against.
            embsim_pin:
              - 'SIL/embsim'
              - '.gitmodules'
            protoemb_pin:
              - 'Protocol/ProtoEmb'
              - '.gitmodules'

  # Offline gate for the frontend-only Web Serial + WASM control app: Rust unit
  # tests for the protocol core, then build wasm + generated codec, then the app
  # verify gate (typecheck + eslint + vitest + production build).
  wasm-control-ci:
    needs: changes
    if: needs.changes.outputs.wasm_control == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/Control
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install protocol generator deps (pyyaml, jinja2)
        run: pip install -r ../../Protocol/ProtoEmb/core/requirements.txt
      - name: Install libudev (serialport build dependency on Linux)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Cargo test (protoemb-runtime)
        working-directory: Protocol/ProtoEmb/runtime
        run: cargo test
      - name: Install dependencies
        run: npm ci
      - name: Build wasm + generate protocol bindings
        run: |
          npm run build:wasm
          npm run generate:proto
      - name: Verify (typecheck + lint + tests + build)
        run: npm run verify
      # The unit tests cover the logging machinery; they cannot cover the
      # instrumentation call sites, and the worker half (protocol frames,
      # correlation ids, byte ring, batch transport) only runs with a device
      # attached. This drives a scripted fake serial port instead, so unlike the
      # SIL suite it needs no emulator or bridge — just Chrome and the dev
      # server. Without it, a regression that silently empties a bug report
      # would ship green.
      - name: Diagnostics e2e (logging actually captures)
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/mad-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174 >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5174 >/dev/null 2>&1 || {
            echo "=== vite log ==="; cat /tmp/mad-vite.log || true; exit 1
          }
          APP_URL=http://127.0.0.1:5174/ npm run e2e:diagnostics
      - name: Schema ↔ domain mapping lockstep (M12)
        working-directory: ${{ github.workspace }}
        run: |
          pip install pyyaml==6.0.3
          python3 Protocol/scripts/check_schema_domain_lockstep.py

  # ProtoEmb library suite (generator unit tests, cross-language wire
  # conformance, framing + runtime crate tests) run against the *pinned
  # submodule commit*. The suite also runs in the protoemb repo's own CI
  # (https://github.com/RileyMcCarthy/protoemb); this job gates submodule
  # bumps — including the real-schema generator test, which only activates
  # when ../MaDProtocol.yaml is present (i.e. here, not in the standalone CI).
  protoemb-ci:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Protocol/ProtoEmb
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install TypeScript (cross-language conformance leg)
        run: npm install -g typescript
      - name: Install Python test deps (pyyaml, jinja2, pytest)
        run: make setup
      - name: Install libudev (serialport build dependency on Linux)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Run full ProtoEmb test suite
        run: make test

  # BLOCKING, pin-bumps only. Mirror of `embsim-pin-ci` for the other submodule:
  # `protoemb-ci` above runs `make test` on any Protocol/ change, this runs the
  # rest of the upstream gate when the recorded commit moves. protoemb is not a
  # workspace, so the Rust legs are invoked once per crate manifest.
  protoemb-pin-ci:
    needs: changes
    if: needs.changes.outputs.protoemb_pin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Protocol/ProtoEmb
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Protocol/ProtoEmb/framing
            Protocol/ProtoEmb/runtime
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install libudev (serialport build dependency on Linux)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install Python deps (generator + pytest)
        run: make setup
      - name: Example round-trip (examples/verify.sh)
        run: make verify
      - name: Ruff (generator + tests)
        run: pipx run ruff==0.14.11 check --output-format=github core tests
      # The runtime crate is what the shipped app compiles to WebAssembly, so
      # the wasm target is a first-class leg, not an afterthought. `--lib` on the
      # wasm clippy leg because that is exactly what wasm-pack builds — the
      # native-only protoemb-bridge bin is cfg'd out of the wasm build.
      - name: clippy framing (native)
        run: cargo clippy --manifest-path framing/Cargo.toml --all-targets -- -D warnings
      - name: clippy runtime (native)
        run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - name: clippy runtime (wasm32)
        run: cargo clippy --manifest-path runtime/Cargo.toml --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build (runtime, web target)
        run: wasm-pack build runtime --target web --release --out-dir /tmp/protoemb-wasm-pkg
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Supply chain (cargo-deny per crate + pip-audit)
        run: |
          set -euo pipefail
          cargo deny --manifest-path framing/Cargo.toml check
          cargo deny --manifest-path runtime/Cargo.toml check
          pipx run pip-audit -r core/requirements.txt
      # MSRV floor, read from each crate's own manifest (see embsim-pin-ci).
      - name: Build both crates on their declared MSRV
        run: |
          set -euo pipefail
          for crate in framing runtime; do
            MSRV=$(sed -nE 's/^rust-version *= *"([^"]+)".*/\1/p' "$crate/Cargo.toml" | head -1)
            test -n "$MSRV" || { echo "::error::no rust-version in $crate/Cargo.toml"; exit 1; }
            echo "$crate MSRV = $MSRV"
            rustup toolchain install "$MSRV" --profile minimal
            cargo "+$MSRV" build --manifest-path "$crate/Cargo.toml"
          done

  # ADVISORY — reports on every PR, deliberately NOT in ci-gate.needs yet.
  #
  # The full Control ↔ SIL e2e suite: the real app in real Chrome, driving the
  # real emulator over the WS↔PTY bridge. It is the only job that exercises the
  # app, the generated codec, the firmware and the machine models as one system,
  # so it is the only one that can catch an integration break — exactly the
  # class of bug that shipped while this ran nightly: the firmware never created
  # `<mount>/gcode/`, so on a fresh SD root every uploaded test stored zero
  # moves. Nothing offline could have seen it; it is fixed in this branch.
  #
  # Why it does not gate yet. The suite's settle windows are wall-clock
  # (`waitForTimeout`) while the emulator's motion is virtual-time, and a
  # 4-vCPU runner also hosting Chrome, Vite, the bridge and the emulator does
  # not sustain real time. Moves are then sampled mid-flight: the 10 mm @
  # 10 mm/s cell lands at ~55% while the 50 ms and 200 ms cells pass, so the
  # discriminator is move DURATION, not distance. Gating on that today would
  # gate every PR on host speed rather than on correctness.
  #
  # To promote it: make the waits track virtual-time progress instead of wall
  # time (or give the emulator enough CPU to hold real time under CI load),
  # then add `control-e2e-sil` back to ci-gate.needs. Nothing else is required —
  # the job itself is complete, and its failures are real findings, not noise.
  #
  # The suite is serial by contract (one emulator, one PTY, one client at a
  # time). The nightly workflow still runs it on `main` for drift over time.
  control-e2e-sil:
    needs: changes
    if: |
      needs.changes.outputs.is_release != 'true' &&
      (needs.changes.outputs.wasm_control == 'true' || needs.changes.outputs.sil == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Software/Control
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SIL
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Install protocol generator deps
        run: pip install -r ../../Protocol/ProtoEmb/core/requirements.txt
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build SIL emulator (firmware + protocol + cargo)
        working-directory: SIL
        run: make emulator
      - name: Install Control deps + wasm + proto
        run: |
          npm ci
          npm run build:wasm
          npm run generate:proto
      # The suite launches system Chrome (`channel: 'chrome'`), preinstalled on
      # the runner; this brings in the shared libraries it needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Unpaced virtual time, NOT the real-time playground. The suite does not
      # need real-time speed, and under --speed 1.0 the emulator must sustain a
      # real-time factor of 1.0 — which a shared 4-vCPU runner cannot, so the
      # suite ends up measuring the runner instead of the code.
      - name: Start the e2e emulator (unpaced virtual time)
        working-directory: SIL
        run: |
          nohup make e2e-emulator > /tmp/mad-playground.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -e /tmp/tty.rpi ]; then echo "PTY ready after ${i}s"; break; fi
            sleep 2
          done
          if [ ! -e /tmp/tty.rpi ]; then
            echo "=== playground log ==="
            cat /tmp/mad-playground.log || true
            exit 1
          fi
      - name: Start WS bridge + Vite dev server
        run: |
          nohup npm run sil:bridge > /tmp/mad-bridge.log 2>&1 &
          nohup npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/mad-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5174/ >/dev/null || {
            echo "=== vite log ==="; cat /tmp/mad-vite.log || true; exit 1
          }
          for i in $(seq 1 30); do
            (echo >/dev/tcp/127.0.0.1/9999) >/dev/null 2>&1 && break
            sleep 1
          done
          (echo >/dev/tcp/127.0.0.1/9999) >/dev/null 2>&1 || {
            echo "=== bridge log ==="; cat /tmp/mad-bridge.log || true; exit 1
          }
      - name: Run the full e2e suite
        env:
          APP_URL: http://127.0.0.1:5174
          BRIDGE_URL: ws://127.0.0.1:9999
        run: npm run e2e
      # e2e/artifacts holds the per-scenario merged main+worker app log that
      # dumpFailureArtifacts writes — without it a red run can only be diagnosed
      # by reproducing it, which for this suite means reproducing CI.
      # Collect into one directory first: upload-artifact roots the archive at the
      # least common ancestor of its paths, and mixing /tmp with the workspace
      # would root it at / and bury everything under a deep prefix.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/e2e-out
          cp /tmp/mad-playground.log /tmp/mad-bridge.log /tmp/mad-vite.log /tmp/e2e-out/ 2>/dev/null || true
          cp -r e2e/artifacts /tmp/e2e-out/scenario-artifacts 2>/dev/null || true
      - name: Upload logs + failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: control-e2e-sil-${{ github.run_number }}
          path: /tmp/e2e-out
          retention-days: 14

  # BLOCKING. The documentation site must build in strict mode (broken nav
  # entries, dead internal links and config warnings are all errors). pages.yml
  # builds the same site, but only on a push to `main` — by which point a bad
  # docs PR has already merged and taken the Pages deploy down with it. This is
  # the same command, one step earlier, where it can still be fixed.
  docs-ci:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict

  # embsim library suite against the *pinned submodule commit* (mirror of
  # protoemb-ci). Upstream also runs this on RileyMcCarthy/embsim; re-running
  # here gates pin bumps and catches unpushed / never-CI'd gitlinks. The MaD
  # SIL workspace only *compiles* path deps (sil-rust) — this job executes the
  # framework tests themselves.
  embsim-ci:
    needs: changes
    if: needs.changes.outputs.sil == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SIL/embsim
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SIL/embsim
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Test embsim-trace (web off)
        run: cargo test -p embsim-trace --no-default-features

  # BLOCKING, pin-bumps only. `embsim-ci` above runs the build/test half of the
  # upstream suite on every SIL change; this job runs the half that only matters
  # when the *pin moves* — the determinism goldens, the lint gate, rustdoc, the
  # MSRV floor and the supply-chain audit. Upstream gates all of these on
  # RileyMcCarthy/embsim, so a pin that has actually been pushed and CI'd will
  # sail through; a pin that was never pushed (or was pushed to a branch that
  # never went green) fails here instead of landing in MaD unverified.
  # Ubuntu-only: upstream's macOS leg covers the platform axis, this covers the
  # commit axis.
  embsim-pin-ci:
    needs: changes
    if: needs.changes.outputs.embsim_pin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SIL/embsim
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SIL/embsim
      - name: rustfmt (gating)
        run: cargo fmt --all --check
      - name: clippy (gating)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo doc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Determinism: the stepped-clock engine event log — order AND every
      # virtual timestamp — must match a blessed golden trace. Run the binary as
      # separate processes so each run re-seeds its HashMaps; that is the class
      # of nondeterminism in-process repetition cannot reach.
      - name: N-run identity + goldens, 5x as separate processes
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            echo "::group::determinism run $run"
            cargo test -p embsim-board --test determinism -- --nocapture
            echo "::endgroup::"
          done
      - name: Stepped-clock engine mechanics
        run: |
          set -euo pipefail
          cargo test -p embsim-board --test stepped_clock -- --nocapture
          cargo test -p embsim-board --test ads122u04_stepped -- --nocapture
          cargo test -p embsim-board --test pulse_bridge_stepped -- --nocapture
      # A golden regenerated by a test run makes the comparison above vacuous.
      # Blessing is a deliberate local act (EMBSIM_BLESS=1), so a dirty fixture
      # tree here means the goldens rewrote themselves.
      - name: Goldens are unmodified
        run: git diff --exit-code -- board/tests/fixtures/traces
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Supply chain (advisories + licenses + bans + sources)
        run: cargo deny check
      # MSRV floor. Read `rust-version` out of the pinned manifest rather than
      # hardcoding it, so raising the floor upstream doesn't fail here with a
      # misleading compile error. Build only — MSRV governs compilation.
      - name: Build the workspace on its declared MSRV
        run: |
          set -euo pipefail
          MSRV=$(sed -nE 's/^rust-version *= *"([^"]+)".*/\1/p' Cargo.toml | head -1)
          test -n "$MSRV" || { echo "::error::no rust-version in SIL/embsim/Cargo.toml"; exit 1; }
          echo "embsim MSRV = $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" build --workspace

  # Firmware Unity unit tests on the host (platform = native, AddressSanitizer).
  # No Propeller toolchain needed; the platformio pre-hook regenerates the C
  # protocol from the YAML and installs its own generator deps.
  firmware-unit-tests:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install PlatformIO Core (pinned for reproducibility)
        run: pip install "platformio==6.1.18"
      - name: Run firmware Unity unit tests (native_test, ASan)
        working-directory: Firmware/MaDCore
        run: pio test -e native_test

  # ── Phase 0 deterministic gates ───────────────────────────────────────────
  # BLOCKING jobs feed ci-gate. The clippy backlog is cleared, so `sil-rust`
  # now runs rustfmt and clippy `-D warnings` as gating steps — no
  # `continue-on-error` remains anywhere in this file. The one advisory job is
  # `control-e2e-sil`, which is advisory by being absent from `ci-gate.needs`
  # (it still reports pass/fail honestly) rather than by swallowing its own
  # failure.

  # BLOCKING. Protocol codegen health: regenerate all three targets (C/TS/Rust)
  # twice and assert success + byte-reproducibility. Generated files are
  # gitignored (built on demand), so this guards the schema/templates + generator
  # determinism rather than committed-file drift.
  protocol-codegen:
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install codegen deps (pinned)
        run: pip install pyyaml==6.0.3 jinja2==3.1.6
      - name: Generate all three targets twice and assert reproducible
        run: |
          set -euo pipefail
          gen() {
            python3 Protocol/ProtoEmb/core/generate.py \
              --schema Protocol/MaDProtocol.yaml \
              --templates Protocol/ProtoEmb/core/templates \
              --target "$1" --output "$2"
          }
          for pass in a b; do
            gen c  "/tmp/gen-$pass/c"
            gen ts "/tmp/gen-$pass/ts"
            gen rs "/tmp/gen-$pass/rs"
          done
          if ! diff -r /tmp/gen-a /tmp/gen-b; then
            echo "::error::Protocol code generation is non-deterministic (two runs differ)."
            exit 1
          fi
          echo "Codegen succeeded and is byte-reproducible."
      - name: Schema ↔ domain mapping lockstep (M12)
        run: python3 Protocol/scripts/check_schema_domain_lockstep.py

  # BLOCKING. Ruff lint of the PlatformIO SCons hooks; config in ruff.toml
  # (mirrors docs/coding-guidelines/python.md). The ProtoEmb generator is
  # linted in its own repo's CI.
  python-lint:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ruff (lint only)
        run: pipx run ruff==0.13.2 check --output-format=github Firmware/MaDCore/extra_scripts

  # BLOCKING. SIL Rust workspace: builds the generated protocol Rust
  # (make protocol) + libfirmware.a (pio run -e native_emulator), then runs
  # rustfmt, clippy and cargo test — all three gating. The lint backlog that
  # kept clippy advisory has been cleared: the one real finding was fixed, and
  # the generated codec's template-style lints are allowed at the `mod`
  # declaration in Protocol/rust/src/lib.rs.
  sil-rust:
    needs: changes
    if: |
      needs.changes.outputs.is_release != 'true' &&
      needs.changes.outputs.sil == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SIL
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO + protocol generator deps
        run: pip install --upgrade platformio pyyaml jinja2
      - name: Generate the Rust protocol codec (make protocol)
        working-directory: SIL
        run: make protocol
      - name: Build firmware native lib (libfirmware.a)
        working-directory: Firmware/MaDCore
        run: pio run -e native_emulator
      # rustfmt covers the crates this repo authors. The `protocol` crate is
      # excluded because its body is `#[path]`-included generated code that
      # `make protocol` rewrites on every build — formatting it would be undone
      # by the next regeneration, and a gate that cannot be satisfied is worse
      # than no gate.
      - name: rustfmt (gating)
        working-directory: SIL
        run: cargo fmt -p mad-emulator -p models --check
      - name: Clippy (gating)
        working-directory: SIL
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test (blocking)
        working-directory: SIL
        # The workspace is the MaD-side crates only (protocol, models,
        # MaDSim). The embsim submodule suite is re-run by the sibling
        # `embsim-ci` job (mirror of protoemb-ci) on the pinned commit.
        run: cargo test --workspace --all-targets

  # BLOCKING. MISRA/cppcheck via `pio check`. Low severity is disabled in
  # platformio.ini (check_severity = medium, high) — style noise only. Medium and
  # high must be zero; CI fails the job (and thus CI Gate) on any such defect.
  # CERT is not enforced (no cert.py with bundled cppcheck).
  firmware-misra:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO (pinned for cppcheck-version stability)
        run: pip install "platformio==6.1.18"
      - name: Install propeller platform + protocol gen deps
        working-directory: Firmware/MaDCore
        run: |
          pip install pyyaml jinja2
          pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      - name: Run pio check (MISRA / cppcheck) — medium+high must pass
        working-directory: Firmware/MaDCore
        run: |
          set -o pipefail
          # Never combine --silent with --fail-on-defect: silent defeats the fail gate.
          # check_severity in platformio.ini is medium,high; fail on either.
          pio check -e propeller2 --skip-packages \
            --fail-on-defect=medium --fail-on-defect=high \
            | tee pio-check.txt
          pio check -e propeller2 --skip-packages --json-output \
            | sed -n '/^\[{/,$p' > pio-check.json || true
          {
            echo "## Firmware MISRA / cppcheck (blocking: medium + high)"
            echo '```'
            tail -40 pio-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firmware-misra-${{ github.run_number }}
          path: |
            Firmware/MaDCore/pio-check.txt
            Firmware/MaDCore/pio-check.json
          retention-days: 30

  # BLOCKING (baseline-gated). Firmware layer rule — downward-only includes
  # (APP→DEV→IO→Library→HAL→HW). 11 pre-existing violations are frozen in
  # Firmware/MaDCore/.layering-baseline; the gate fails only on NEW upward
  # includes. Phase 2: burn the baseline down, then run with --strict.
  firmware-layering:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Enforce firmware layering (downward-only includes)
        run: python3 Firmware/MaDCore/scripts/check_layering.py Firmware/MaDCore/src

  build-firmware:
    needs: changes
    # Build firmware on firmware changes, or always for firmware releases
    if: |
      needs.changes.outputs.is_firmware_release == 'true' ||
      needs.changes.outputs.firmware == 'true'
    runs-on: macos-latest-large
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Install propeller platformio platform
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      - name: Set version for CI build
        id: get_version
        run: |
          if [[ "${{ needs.changes.outputs.is_firmware_release }}" == "true" ]]; then
            VERSION=${GITHUB_REF#refs/tags/firmware-v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi
      - name: Build Firmware - Debug Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_debug --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Release Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_release --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Native library (for SIL testing)
        working-directory: Firmware/MaDCore
        run: pio run -e native_emulator --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Copy and rename build artifacts
        run: |
          set -uxo pipefail
          mkdir -p release-assets
          V="${{ steps.get_version.outputs.VERSION }}"
          echo "=== built artifacts under .pio/build ==="
          find Firmware/MaDCore/.pio/build -maxdepth 2 -type f \( -name program -o -name libfirmware.a \) -print
          # Best-effort: copy each artifact if present, warn (don't fail) if a build env's
          # output is absent. The build steps above are the real gate; artifact assembly is
          # release-prep. NOTE: propeller2_debug's output currently disappears after build
          # (force_o0 post-hook / pio interaction) — tracked separately.
          copy_if() { if [ -f "$1" ]; then cp "$1" "$2" && echo "copied -> $2"; else echo "::warning::artifact missing, skipped: $1"; fi; }
          copy_if "Firmware/MaDCore/.pio/build/propeller2_debug/program"     "release-assets/MaD-Firmware-$V-debug.bin"
          copy_if "Firmware/MaDCore/.pio/build/propeller2_release/program"   "release-assets/MaD-Firmware-$V-release.bin"
          copy_if "Firmware/MaDCore/.pio/build/native_emulator/libfirmware.a" "release-assets/MaD-Firmware-$V-native.a"
          ls -la release-assets/

      - name: Set artifact name
        id: artifact
        run: echo "name=MaD-Firmware-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-assets/

  build-hardware:
    needs: changes
    # Build hardware when hardware changes or for hardware releases
    if: |
      needs.changes.outputs.is_hardware_release == 'true' ||
      needs.changes.outputs.hardware == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: EdgeBoard
            pcb_path: Hardware/EdgeBoard/KiCad/MaD_Edge.kicad_pcb
            sch_path: Hardware/EdgeBoard/KiCad/MaD_Edge.kicad_sch
          - project: DS2Addon
            pcb_path: Hardware/DS2Addon/KICAD/DS2_Addon.kicad_pcb
            sch_path: Hardware/DS2Addon/KICAD/DS2_Addon.kicad_sch
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
    - uses: actions/checkout@v7
    
    - name: Generate manufacturing files using KiBot
      uses: INTI-CMNB/KiBot@v2_k9   # KiCad 9 — board files use generator_version 9.0
      with:
        config: .kibot/config.kibot.yaml
        board: ${{ matrix.pcb_path }}
        schema: ${{ matrix.sch_path }}

    - name: Set artifact name
      id: artifact
      run: echo "name=${{ matrix.project }}-hardware-${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: |
          Manufacturing/
          Documentation/
          *_documentation.zip
          *_gerbers.zip

  release-firmware:
    needs: [changes, build-firmware]
    if: |
      needs.changes.outputs.is_firmware_release == 'true' &&
      needs.build-firmware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-firmware.outputs.artifact-name }}
          path: artifacts
          merge-multiple: true
          
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/firmware-v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: MaD Firmware ${{ steps.get_version.outputs.VERSION }}
          tag_name: firmware-v${{ steps.get_version.outputs.VERSION }}
          files: artifacts/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-hardware:
    needs: [changes, build-hardware]
    if: |
      needs.changes.outputs.is_hardware_release == 'true' &&
      needs.build-hardware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all hardware artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-hardware-*'
          
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/hardware-v}" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: MaD Hardware ${{ steps.get_version.outputs.VERSION }}
          tag_name: hardware-v${{ steps.get_version.outputs.VERSION }}
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required status check for branch protection. It aggregates every
  # build/unit/SIL job: it fails if any of them FAILED or was CANCELLED, and
  # passes when they all succeeded or were legitimately skipped (e.g. a
  # docs-only PR skips the component jobs). Mark THIS check — "CI Gate" — as the
  # required status check on `main` instead of each job, so path-filtered skips
  # never block a PR.
  ci-gate:
    name: CI Gate
    needs:
      - changes
      - wasm-control-ci
      # control-e2e-sil is intentionally absent — see the ADVISORY note on that
      # job. Add it here to promote it to blocking; nothing else changes.
      - protoemb-ci
      - protoemb-pin-ci
      - embsim-ci
      - embsim-pin-ci
      - docs-ci
      - firmware-unit-tests
      - protocol-codegen
      - firmware-layering
      - firmware-misra
      - python-lint
      - sil-rust
      - build-firmware
      - build-hardware
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          failed=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI Gate failed — these required jobs did not pass:"
            echo "$failed"
            exit 1
          fi
          echo "CI Gate passed — every required job succeeded or was skipped."