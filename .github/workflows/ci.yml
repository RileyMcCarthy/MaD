name: CI

on:
  push:
    paths:
      - 'Software/**'
      - 'Firmware/**'
  pull_request:
    paths:
      - 'Software/**'
      - 'Firmware/**'

jobs:
  # Determine which components need to be built based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      software: ${{ steps.changes.outputs.software }}
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            software:
              - 'Software/**'
            firmware:
              - 'Firmware/**'

  build-software:
    needs: changes
    # Build software if either software or firmware changes (needed for SIL testing)
    if: needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true'
    runs-on: macos-latest-large
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        
      - name: Ensure Python distutils is available
        run: |
          python3 -m pip install --upgrade pip setuptools --break-system-packages

      - name: Install dependencies
        working-directory: Software/MaDControl
        run: npm install
    
      - name: Build application
        working-directory: Software/MaDControl
        run: |
          npm run build:dll
          npm run build
          # CI workflow only creates artifacts for testing - releases handled by separate workflows
          echo "Building for CI testing - creating artifacts only"
          npm exec electron-builder -- --publish never --win --mac --linux

      - name: Set artifact name
        id: artifact
        run: echo "name=MaD-Control-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            Software/MaDControl/release/build/*.dmg
            Software/MaDControl/release/build/*.zip
            Software/MaDControl/release/build/*.exe
            Software/MaDControl/release/build/*.AppImage
            Software/MaDControl/release/build/*.deb

  build-firmware:
    needs: changes
    # Build firmware if either software or firmware changes (needed for SIL testing)
    if: needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Install propeller platformio platform
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      - name: Set version for CI build
        id: get_version
        run: |
          # CI workflow always uses dev version - releases handled by separate workflows
          echo "VERSION=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Using CI version: dev-${{ github.run_number }}"
      - name: Build Firmware - Debug Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_debug --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Release Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_release --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Native Version (for SIL testing)
        working-directory: Firmware/MaDCore
        run: pio run -e native --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Copy and rename build artifacts
        run: |
          mkdir -p release-assets
          # Copy debug version with .bin extension
          cp Firmware/MaDCore/.pio/build/propeller2_debug/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-debug.bin
          # Copy release version with .bin extension
          cp Firmware/MaDCore/.pio/build/propeller2_release/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-release.bin
          # Copy native version with .bin extension for SIL testing
          cp Firmware/MaDCore/.pio/build/native/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-native.bin
          chmod +x release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-native.bin

      - name: Set artifact name
        id: artifact
        run: echo "name=MaD-Firmware-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-assets/

  sil-tests:
    needs: [changes, build-software, build-firmware]
    # Run SIL tests when either software or firmware changes
    # Both builds must succeed since they both run when either component changes
    if: |
      always() && 
      (needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true') &&
      needs.build-software.result == 'success' &&
      needs.build-firmware.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download Software Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-software.outputs.artifact-name }}
          path: ./software-artifacts/
        
      - name: Prepare software for testing
        run: |
          echo "Preparing software artifacts for testing..."
          
          # Look for AppImage (controlled by software workflow)
          if ls ./software-artifacts/*.AppImage 1> /dev/null 2>&1; then
            echo "✅ Found AppImage distribution"
            mkdir -p ./mad-control/
            cp ./software-artifacts/*.AppImage ./mad-control/
            chmod +x ./mad-control/*.AppImage
          else
            echo "❌ AppImage not found"
            ls -la ./software-artifacts/
            exit 1
          fi
          
          echo "✅ Software ready for testing:"
          ls -la ./mad-control/

      - name: Download Firmware Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-firmware.outputs.artifact-name }}
          path: ./firmware-artifacts/
        
      - name: Prepare firmware for testing
        run: |
          echo "Preparing firmware artifacts for testing..."
          
          # Find the native firmware binary
          if ls ./firmware-artifacts/*-native.bin 1> /dev/null 2>&1; then
            mkdir -p ./firmware/
            cp ./firmware-artifacts/*-native.bin ./firmware/mad-firmware-native.bin
            chmod +x ./firmware/mad-firmware-native.bin
            echo "✅ Native firmware binary ready"
          else
            echo "❌ Native firmware binary not found"
            ls -la ./firmware-artifacts/
            exit 1
          fi
          
          echo "✅ Firmware ready for testing:"
          ls -la ./firmware/

      - name: Install system dependencies for testing
        run: |
          # Install Playwright browsers and Xvfb for headless testing
          sudo apt-get update && sudo apt-get install -y xvfb python3-venv

      - name: Setup Playwright for testing
        run: |
          cd ./Software/MaDControl
          # Install minimal dependencies needed for Playwright
          npm ci --omit=optional --ignore-scripts
          npx playwright install --with-deps

      - name: Setup firmware emulation environment
        run: |
          echo "Setting up firmware emulation environment using makefile..."
          cd Firmware/MaDCore/Emulation
          
          # Use makefile to setup Python virtual environment
          make venv
          
          echo "✅ Firmware emulation environment ready"

      - name: Start firmware emulation
        run: |
          echo "Starting firmware emulator with pre-built binary..."
          cd Firmware/MaDCore/Emulation
          
          # Set environment variable for prebuilt firmware
          export MAD_FIRMWARE_EXECUTABLE="$(pwd)/../../../firmware/mad-firmware-native.bin"
          
          # Start emulator using makefile (Server.py handles socat creation)
          nohup make run > /tmp/firmware-emulator.log 2>&1 &
          echo $! > /tmp/firmware.pid
          sleep 5
          
          # Check if emulator started successfully
          if kill -0 $(cat /tmp/firmware.pid 2>/dev/null) 2>/dev/null; then
            echo "✅ Firmware emulator started successfully"
          else
            echo "⚠️ Firmware emulator failed to start"
          fi
        continue-on-error: true

      - name: Run SIL tests with virtual display
        working-directory: ./Software/MaDControl
        env:
          MAD_CONTROL_DIST_PATH: ../../mad-control
        run: |
          # Start virtual display for headless testing
          Xvfb :99 -screen 0 1280x960x24 -ac &
          sleep 2
          
          # Run all Playwright tests with proper reporting and capture logs
          echo "Running Playwright SIL tests against pre-built artifacts..."
          npx playwright test --reporter=github,list 2>&1 | tee /tmp/playwright-test.log
          
          # Check test results and show summary
          if [ $? -eq 0 ]; then
            echo "✅ All Playwright tests passed successfully"
          else
            echo "❌ Some Playwright tests failed - check logs for details"
            exit 1
          fi

      - name: Collect test artifacts
        if: always()
        run: |
          # Create structured artifact directories
          mkdir -p ./artifacts/{Logs,Screenshots,TestResults}
          
          # Collect logs
          cp /tmp/firmware-emulator.log ./artifacts/Logs/ 2>/dev/null || echo "No firmware log found"
          cp /tmp/playwright-test.log ./artifacts/Logs/ 2>/dev/null || echo "No Playwright log found"
          
          # Collect screenshots from all test suites
          find ./Software/MaDControl/test-results/ -name "*.png" -exec cp {} ./artifacts/Screenshots/ \; 2>/dev/null || echo "No screenshots found"
          
          # Collect test results and traces
          find ./Software/MaDControl/test-results/ -name "*.zip" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No trace files found"
          find ./Software/MaDControl/test-results/ -name "*.html" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No HTML reports found"
          
          # Show artifact summary
          echo "=== Test Artifacts Summary ==="
          echo "Logs: $(ls -1 ./artifacts/Logs/ 2>/dev/null | wc -l) files"
          echo "Screenshots: $(ls -1 ./artifacts/Screenshots/ 2>/dev/null | wc -l) files"
          echo "Test Results: $(ls -1 ./artifacts/TestResults/ 2>/dev/null | wc -l) files"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sil-test-results-${{ github.run_number }}
          path: ./artifacts/
          retention-days: 30