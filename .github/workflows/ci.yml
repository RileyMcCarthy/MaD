name: CI

on:
  push:
    paths:
      - 'Software/**'
      - 'Firmware/**'
      - 'Hardware/**'
    tags:
      - 'software-v*'
      - 'firmware-v*'
      - 'hardware-v*'
  pull_request:
    paths:
      - 'Software/**'
      - 'Firmware/**'
      - 'Hardware/**'

permissions:
  contents: write
  packages: write

jobs:
  # Determine which components need to be built based on changed files
  changes:
    runs-on: ubuntu-latest
    outputs:
      software: ${{ steps.changes.outputs.software }}
      firmware: ${{ steps.changes.outputs.firmware }}
      hardware: ${{ steps.changes.outputs.hardware }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
      is_software_release: ${{ startsWith(github.ref, 'refs/tags/software-v') }}
      is_firmware_release: ${{ startsWith(github.ref, 'refs/tags/firmware-v') }}
      is_hardware_release: ${{ startsWith(github.ref, 'refs/tags/hardware-v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            software:
              - 'Software/**'
            firmware:
              - 'Firmware/**'
            hardware:
              - 'Hardware/**'

  build-software:
    needs: changes
    # Build software for SIL testing when software/firmware changes, or always for software releases
    if: |
      needs.changes.outputs.is_software_release == 'true' ||
      (needs.changes.outputs.is_release != 'true' && 
       (needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true'))
    runs-on: macos-latest-large
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        
      - name: Ensure Python distutils is available
        run: |
          python3 -m pip install --upgrade pip setuptools --break-system-packages

      - name: Install dependencies
        working-directory: Software/MaDControl
        run: npm install
    
      - name: Set version for build
        id: get_version
        run: |
          if [[ "${{ needs.changes.outputs.is_software_release }}" == "true" ]]; then
            # Extract version from software release tag
            VERSION=${GITHUB_REF#refs/tags/software-v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using software release version: $VERSION"
          else
            # CI workflow uses dev version
            echo "VERSION=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "Using CI version: dev-${{ github.run_number }}"
          fi

      - name: Build application
        working-directory: Software/MaDControl
        run: |
          npm run build:dll
          npm run build
          if [[ "${{ needs.changes.outputs.is_software_release }}" == "true" ]]; then
            echo "Building for software release"
            npm exec electron-builder -- --publish never --win --mac --linux
          else
            echo "Building for CI testing - creating artifacts only"
            npm exec electron-builder -- --publish never --win --mac --linux
          fi

      - name: Set artifact name
        id: artifact
        run: echo "name=MaD-Control-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            Software/MaDControl/release/build/*.dmg
            Software/MaDControl/release/build/*.zip
            Software/MaDControl/release/build/*.exe
            Software/MaDControl/release/build/*.AppImage
            Software/MaDControl/release/build/*.deb
            Software/MaDControl/release/app/dist/

  build-firmware:
    needs: changes
    # Build firmware for SIL testing when software/firmware changes, or always for firmware releases
    if: |
      needs.changes.outputs.is_firmware_release == 'true' ||
      (needs.changes.outputs.is_release != 'true' && 
       (needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true'))
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Install propeller platformio platform
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      - name: Set version for CI build
        id: get_version
        run: |
          if [[ "${{ needs.changes.outputs.is_firmware_release }}" == "true" ]]; then
            # Extract version from firmware release tag
            VERSION=${GITHUB_REF#refs/tags/firmware-v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using firmware release version: $VERSION"
          else
            # CI workflow uses dev version
            echo "VERSION=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "Using CI version: dev-${{ github.run_number }}"
          fi
      - name: Build Firmware - Debug Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_debug --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Release Version
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_release --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Build Firmware - Native Version (for SIL testing)
        working-directory: Firmware/MaDCore
        run: pio run -e native --program-arg="-DFIRMWARE_VERSION=\"${{ steps.get_version.outputs.VERSION }}\""
      - name: Copy and rename build artifacts
        run: |
          mkdir -p release-assets
          # Copy debug version with .bin extension
          cp Firmware/MaDCore/.pio/build/propeller2_debug/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-debug.bin
          # Copy release version with .bin extension
          cp Firmware/MaDCore/.pio/build/propeller2_release/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-release.bin
          # Copy native version with .bin extension for SIL testing
          cp Firmware/MaDCore/.pio/build/native/program release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-native.bin
          chmod +x release-assets/MaD-Firmware-${{ steps.get_version.outputs.VERSION }}-native.bin

      - name: Set artifact name
        id: artifact
        run: echo "name=MaD-Firmware-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-assets/

  build-hardware:
    needs: changes
    # Build hardware when hardware changes or for hardware releases
    if: |
      needs.changes.outputs.is_hardware_release == 'true' ||
      (needs.changes.outputs.is_release != 'true' && needs.changes.outputs.hardware == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: EdgeBoard
            pcb_path: Hardware/EdgeBoard/KiCad/MaD_Edge.kicad_pcb
            sch_path: Hardware/EdgeBoard/KiCad/MaD_Edge.kicad_sch
          - project: DS2Addon
            pcb_path: Hardware/DS2Addon/KICAD/DS2_Addon.kicad_pcb
            sch_path: Hardware/DS2Addon/KICAD/DS2_Addon.kicad_sch
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Generate manufacturing files using KiBot
      uses: INTI-CMNB/KiBot@v2_k7
      with:
        config: .kibot/config.kibot.yaml
        board: ${{ matrix.pcb_path }}
        schema: ${{ matrix.sch_path }}

    - name: Set artifact name
      id: artifact
      run: echo "name=${{ matrix.project }}-hardware-${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: |
          Manufacturing/
          Documentation/
          *_documentation.zip
          *_gerbers.zip

  sil-tests:
    needs: [changes, build-software, build-firmware]
    # Run SIL tests when either software or firmware changes (not hardware-only, not for releases)
    # Both builds must succeed since they both run when either component changes
    if: |
      always() && 
      needs.changes.outputs.is_release != 'true' &&
      (needs.changes.outputs.software == 'true' || needs.changes.outputs.firmware == 'true') &&
      needs.build-software.result == 'success' &&
      needs.build-firmware.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download Software Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-software.outputs.artifact-name }}
          path: ./software-artifacts/
        
      - name: Prepare software for testing
        run: |
          echo "Preparing software artifacts for testing..."
          
          # Check for unpacked app structure (for Playwright testing)
          if [ -d "./software-artifacts/dist" ]; then
            echo "✅ Found unpacked app structure for Playwright testing"
            mkdir -p ./mad-control/
            # Create the expected structure for tests: main/main.js
            cp -r ./software-artifacts/dist/main ./mad-control/
            cp -r ./software-artifacts/dist/renderer ./mad-control/
            echo "✅ Unpacked app structure ready for testing:"
            ls -la ./mad-control/main/
          else
            echo "❌ Unpacked app structure not found"
            echo "Available artifacts:"
            ls -la ./software-artifacts/
            exit 1
          fi

      - name: Download Firmware Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-firmware.outputs.artifact-name }}
          path: ./firmware-artifacts/
        
      - name: Prepare firmware for testing
        run: |
          echo "Preparing firmware artifacts for testing..."
          
          # Find the native firmware binary
          if ls ./firmware-artifacts/*-native.bin 1> /dev/null 2>&1; then
            mkdir -p ./firmware/
            cp ./firmware-artifacts/*-native.bin ./firmware/mad-firmware-native.bin
            chmod +x ./firmware/mad-firmware-native.bin
            echo "✅ Native firmware binary ready"
          else
            echo "❌ Native firmware binary not found"
            ls -la ./firmware-artifacts/
            exit 1
          fi
          
          echo "✅ Firmware ready for testing:"
          ls -la ./firmware/

      - name: Install system dependencies for testing
        run: |
          # Install Playwright browsers and Xvfb for headless testing
          sudo apt-get update && sudo apt-get install -y xvfb python3-venv

      - name: Setup Playwright for testing
        run: |
          cd ./Software/MaDControl
          # Install full dependencies including electron for Playwright testing
          npm ci --legacy-peer-deps
          # Ensure electron is properly installed
          npx electron --version || npm install electron --save-dev
          npx playwright install --with-deps

      - name: Setup firmware emulation environment
        run: |
          echo "Setting up firmware emulation environment using makefile..."
          cd Firmware/MaDCore/Emulation
          
          # Use makefile to setup Python virtual environment
          make venv
          
          echo "✅ Firmware emulation environment ready"

      - name: Start firmware emulation
        run: |
          echo "Starting firmware emulator with pre-built binary..."
          cd Firmware/MaDCore/Emulation
          
          # Set environment variable for prebuilt firmware
          export MAD_FIRMWARE_EXECUTABLE="$(pwd)/../../../firmware/mad-firmware-native.bin"
          
          # Start emulator using makefile (Server.py handles socat creation)
          nohup make run > /tmp/firmware-emulator.log 2>&1 &
          echo $! > /tmp/firmware.pid
          sleep 5
          
          # Check if emulator started successfully
          if kill -0 $(cat /tmp/firmware.pid 2>/dev/null) 2>/dev/null; then
            echo "✅ Firmware emulator started successfully"
          else
            echo "⚠️ Firmware emulator failed to start"
          fi
        continue-on-error: true

      - name: Run SIL tests with virtual display
        working-directory: ./Software/MaDControl
        env:
          MAD_CONTROL_DIST_PATH: ../../mad-control
          DISPLAY: :99
        run: |
          # Start virtual display for headless testing
          Xvfb :99 -screen 0 1280x960x24 -ac &
          export DISPLAY=:99
          sleep 3
          
          # Run all Playwright tests with proper reporting and capture logs
          echo "Running Playwright SIL tests against pre-built artifacts..."
          set +e  # Don't exit on first error to capture exit code
          npx playwright test --reporter=github,list 2>&1 | tee /tmp/playwright-test.log
          TEST_EXIT_CODE=$?
          set -e
          
          echo "Playwright test exit code: $TEST_EXIT_CODE"
          
          # Check test results and show summary
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ All Playwright tests passed successfully"
          else
            echo "❌ Playwright tests failed with exit code $TEST_EXIT_CODE"
            echo "See test artifacts for detailed failure information"
            # Show last part of test output for immediate feedback
            echo "=== Test Summary ==="
            tail -20 /tmp/playwright-test.log
            exit $TEST_EXIT_CODE
          fi

      - name: Collect test artifacts
        if: always()
        run: |
          # Create structured artifact directories
          mkdir -p ./artifacts/{Logs,Screenshots,TestResults}
          
          # Collect logs
          cp /tmp/firmware-emulator.log ./artifacts/Logs/ 2>/dev/null || echo "No firmware log found"
          cp /tmp/playwright-test.log ./artifacts/Logs/ 2>/dev/null || echo "No Playwright log found"
          
          # Collect screenshots from all test suites
          find ./Software/MaDControl/test-results/ -name "*.png" -exec cp {} ./artifacts/Screenshots/ \; 2>/dev/null || echo "No screenshots found"
          
          # Collect test results and traces
          find ./Software/MaDControl/test-results/ -name "*.zip" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No trace files found"
          find ./Software/MaDControl/test-results/ -name "*.html" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No HTML reports found"
          
          # Show artifact summary
          echo "=== Test Artifacts Summary ==="
          echo "Logs: $(ls -1 ./artifacts/Logs/ 2>/dev/null | wc -l) files"
          echo "Screenshots: $(ls -1 ./artifacts/Screenshots/ 2>/dev/null | wc -l) files"
          echo "Test Results: $(ls -1 ./artifacts/TestResults/ 2>/dev/null | wc -l) files"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sil-test-results-${{ github.run_number }}
          path: ./artifacts/
          retention-days: 30

  # Release jobs - only run when tags are pushed
  release-software:
    needs: [changes, build-software]
    if: |
      needs.changes.outputs.is_software_release == 'true' &&
      needs.build-software.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download software artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-software.outputs.artifact-name }}
          path: artifacts
          
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/software-v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MaD Control ${{ steps.get_version.outputs.VERSION }}
          tag_name: software-v${{ steps.get_version.outputs.VERSION }}
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-firmware:
    needs: [changes, build-firmware]
    if: |
      needs.changes.outputs.is_firmware_release == 'true' &&
      needs.build-firmware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-firmware.outputs.artifact-name }}
          path: artifacts
          
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/firmware-v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MaD Firmware ${{ steps.get_version.outputs.VERSION }}
          tag_name: firmware-v${{ steps.get_version.outputs.VERSION }}
          files: artifacts/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-hardware:
    needs: [changes, build-hardware]
    if: |
      needs.changes.outputs.is_hardware_release == 'true' &&
      needs.build-hardware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all hardware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-hardware-*'
          
      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/hardware-v}" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MaD Hardware ${{ steps.get_version.outputs.VERSION }}
          tag_name: hardware-v${{ steps.get_version.outputs.VERSION }}
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}