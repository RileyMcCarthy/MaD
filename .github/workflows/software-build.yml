name: Build Software (Release Only)

on:
  push:
    tags:
      - 'software-v*'

jobs:
  build:
    runs-on: macos-latest-large

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        
      - name: Ensure Python distutils is available
        run: |
          python3 -m pip install --upgrade pip setuptools --break-system-packages

      - name: Install dependencies
        working-directory: Software/MaDControl
        run: npm install
    
      - name: Build and publish release
        working-directory: Software/MaDControl
        run: |
          npm run build:dll
          npm run build
          echo "Building release from tag - will publish to GitHub releases"
          npm exec electron-builder -- --publish onTag --win --mac --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 