# Nightly e2e on the ISS: the shipped FlexC image, and a real browser.
#
# ONE configuration, deliberately: the only valid SIL pairing. The P2 image is
# interpreted by the ISS, and Chrome runs inside a QEMU guest whose clock the
# board meters, talking real Web Serial to the emulated FTDI. The native
# firmware library that ci.yml's per-PR e2e job used to run behind the WS/PTY
# bridge is gone, and the ISS behind that bridge measures the host rather than
# the machine, so this job is now the only e2e run that touches the board.
#
# It is not per-PR because a PR cannot afford it: the ISS runs at ~0.024x real
# time (#122 measured three scenarios at 1,534 s). ci.yml's
# `control-e2e-boardless` gates every app/protocol change on the board-free
# scenarios instead. ci.yml is the source of truth for which jobs gate; do not
# infer it from here.
#
# Use `workflow_dispatch` with suite=full to run the whole suite instead of
# the smoke subset.
#
# WHAT STILL DOES NOT TOUCH THE BOARD, in this job or any other. Nine
# scenarios -- A1 and FW1/2/3/5/6/7/8/9 -- call `chromium.launch` directly and
# drive a HOST Chrome against in-page fakes (installFakeBootRom,
# installOpfsDataDir). They never reach an emulator, so they run identically
# here and in `control-e2e-boardless`.
#
# Nothing in p2iss, embsim/qemu or embsim/peripherals models DTR, so the
# guest's emulated FTDI has no way to drive the P2's reset line and a real
# flash cannot be performed. Moving the FW scenarios onto the ISS means
# modelling that line, not flipping a flag.
#
# B5-reconnect, M11-idle-drop and M11-mid-test-drop run here: fixtures'
# dropLink() asks the board (CONTROL_URL, mad-emulator --trace-port) to unplug
# the emulated FTDI for a few seconds, a genuine USB detach.

name: E2E nightly (ISS + QEMU)

on:
  schedule:
    # 06:17 UTC daily
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke | full'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cosim-iss-qemu:
    name: E2E on the ISS (FlexC image + QEMU guest)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Software/Control
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SIL
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install system deps (QEMU x86_64 + qemu-img)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config qemu-system-x86 qemu-utils

      # embsim picks its accelerator by OPENING /dev/kvm read-write
      # (embsim/qemu/src/chrome.rs). The node exists on GitHub-hosted Linux
      # runners but is root:kvm 0660, so without this the guest silently falls
      # back to TCG and then fails to boot inside the warmup timeout — a
      # failure that looks like a hang rather than a permissions problem.
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || {
            echo "::error::/dev/kvm is not writable — the guest would run under TCG and time out"
            exit 1
          }

      - name: Install PlatformIO + protocol generator deps
        run: |
          pip install -U platformio
          pip install -r ../../Protocol/ProtoEmb/core/requirements.txt

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install the Propeller platform (flexcc/flexspin)
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git

      # The P2 image is what the ISS interprets; there is no native library to
      # link any more. Building one AFTER the image is the likely reason this
      # job failed with "No such file or directory" reading the image from
      # 2026-09-20 on: on the runner, a later `pio run` for another env has
      # been seen to clean the first env's build directory.
      - name: Build the P2 image + protocol
        working-directory: SIL
        run: make p2image protocol

      # --release is not optional. The ISS interprets every P2 instruction and
      # a dev-profile build is far too slow to reach the guest's warmup
      # deadline (see the note on playground-iss in SIL/makefile).
      - name: Build mad-emulator (release)
        working-directory: SIL
        run: cargo build --release --bin mad-emulator

      - name: Install Control deps + wasm + proto
        run: |
          npm ci
          npm run build:wasm
          npm run generate:proto

      # A handful of scenarios (A1, the FW* firmware-flash ones) still drive a
      # HOST Chrome with in-page fakes and never touch the board.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # ~2.8 GB and tens of minutes to provision, and it changes only when
      # build.sh or the guest config does — so it is keyed on their hashes and
      # rebuilt only on a miss.
      - name: Restore the Chrome guest image
        id: guest
        uses: actions/cache@v6
        with:
          path: ~/.cache/embsim/qemu/chrome-debian13-x86_64.qcow2
          key: embsim-guest-x86_64-${{ hashFiles('SIL/embsim/qemu/guest/chrome/**') }}

      - name: Build the Chrome guest image
        if: steps.guest.outputs.cache-hit != 'true'
        working-directory: SIL/embsim
        run: ARCH=x86_64 qemu/guest/chrome/build.sh

      # The board starts the guest and parks; the DevTools port answers only
      # once the board is slicing the guest's vCPU, and then only during the
      # guest's duty cycle — so this polls patiently rather than assuming a
      # fixed boot time.
      - name: Start the cosim (ISS + QEMU guest) and Vite
        working-directory: SIL
        run: |
          nohup cargo run --release --bin mad-emulator -- \
            ../Firmware/MaDCore/.pio/build/propeller2_debug/program \
            --computer "$HOME/.cache/embsim/qemu/chrome-debian13-x86_64.qcow2" \
            --devtools-port 9222 --trace-port 9223 --sd-path ./sd --pty-path /tmp/tty.iss \
            --log-level info > /tmp/cosim-board.log 2>&1 &
          echo $! > /tmp/cosim-board.pid
          cd ../Software/Control
          nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/cosim-vite.log 2>&1 &
          echo $! > /tmp/cosim-vite.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5174/ >/dev/null || {
            echo "=== vite log ==="; cat /tmp/cosim-vite.log || true; exit 1
          }
          for i in $(seq 1 150); do
            if curl -sf --max-time 10 http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "Guest Chrome answered CDP after ~$((i * 4))s"
              break
            fi
            sleep 4
          done
          curl -sf --max-time 20 http://127.0.0.1:9222/json/version || {
            echo "=== board log (tail) ==="; tail -100 /tmp/cosim-board.log || true; exit 1
          }

      # The guest reaches the host's Vite at 10.0.2.2 over slirp, and the
      # guest's managed Chromium policy whitelists exactly that origin for
      # Web Serial — the port number is not negotiable without rebuilding the
      # guest image.
      - name: Run the suite against the ISS
        env:
          CDP_URL: http://127.0.0.1:9222
          APP_URL: http://10.0.2.2:5174
          # The board's control surface: the three link-drop scenarios ask it
          # to unplug the emulated FTDI, which is a real USB detach.
          CONTROL_URL: http://127.0.0.1:9223
        run: |
          SUITE="${{ github.event.inputs.suite || 'smoke' }}"
          if [ "$SUITE" = "full" ]; then
            npm run e2e
          else
            npm run e2e:smoke
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/cosim-out
          cp /tmp/cosim-board.log /tmp/cosim-vite.log /tmp/cosim-out/ 2>/dev/null || true
          cp -r e2e/artifacts /tmp/cosim-out/scenario-artifacts 2>/dev/null || true

      - name: Upload logs + failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosim-iss-qemu-${{ github.run_number }}
          path: /tmp/cosim-out
          retention-days: 14
