# Nightly e2e on the board: the whole suite, on the route the per-PR
# `control-e2e-board` job (ci.yml) runs a subset of.
#
# ONE configuration, deliberately: the only one a browser belongs in. The
# shipped P2 image is interpreted by the ISS, and MaD Control runs in the
# runner's own Chrome, every page and dedicated worker held to the board's
# clock by embsim's `chrome-cdp` node, its Web Serial port the board's
# protocol line. The board is the machine's project, SIL/mad-cosim.toml,
# under `embsim run` (`make e2e`; embsim MIGRATING-MAD.md step 10): the
# production firmware (pio env propeller2) booted off the P2-EC32MB's
# flash, the node on the Edge carrier's debug header J1. Every budget in
# the suite is board time; host time is printed, never asserted. No image,
# no VM.
#
# On the project as drawn the carriage never moves (IC14's secondary
# grounds are on a net of their own, MaD #285; SIL/mad-catalog/tests/mad.rs),
# so the suite skips the scenarios that move it there, each saying why
# (run-all.mjs, PROJECT_CANNOT): the motion matrices, the waveforms, the run
# lifecycle with moves, the mid-test drop and SERVO-stall. They run on the
# board with #285 fixed (make e2e-motion: SIL/mad-ic14-fixed-cosim.toml,
# mad-cosim.toml with one wire on IC14's ground), where the carriage moves,
# in three jobs of their own beside the suite's (the matrix below).
# SERVO-stall stays skipped there, since nothing stops that board's
# carriage: it runs per-PR only (ci.yml, `make e2e-stall`), on that board
# with a hard stop on its carriage, SIL/mad-hard-stop-cosim.toml (MaD
# #298). The nightly does not run it.
#
# Not per-PR because a PR cannot afford it: the ISS runs at a few percent of
# real time, so the whole suite is an hour or more of host time. ci.yml is
# the source of truth for which jobs gate; do not infer it from here.
#
# The node's Chrome canary runs first: embsim-cdp's real-Chrome case in which
# a dedicated worker's 4 ms timer must tick once every four 1 ms grants. It
# fails if the runner's Chrome stops honouring virtual time on worker
# sessions (Chrome's `Emulation` on workers is undocumented), which would put
# the app's worker, and its 2 s response timeout, back on host time.
#
# WHAT STILL DOES NOT TOUCH THE BOARD: A1 and FW1/2/3/5/6/7/8/9 drive a host
# Chrome against in-page fakes (installFakeBootRom, installOpfsDataDir); they
# run here and in `control-e2e-boardless` alike. FW-ISS runs in a step of
# its own, on the project's serial boot, SIL/mad-serial-boot-cosim.toml
# (make e2e-rom): the mask ROM on the module, its flash erased, the node on
# J1.
#
# Use `workflow_dispatch` with suite=smoke to run e2e/smoke-ids.txt instead.

name: E2E nightly (ISS + chrome-cdp)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'full | smoke'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    name: E2E on the ISS (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Four jobs from one set of steps: `suite`, the whole suite on the
    # project as drawn (make e2e) and FW-ISS on the project's serial boot;
    # and `motion 1/3` to `motion 3/3`, the set the project as drawn cannot
    # run, on the board with MaD #285 fixed (make e2e-motion), a third each
    # (MOTION_SHARD: every third scenario, in the suite's order). The set is
    # most of the night: on mad-emulator it took 13 439 s of host time on
    # the runner (run 39556919751), and the #285-fixed project takes longer
    # (the PR that moved it there has the numbers), past one job's ceiling.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: suite
          - part: motion 1/3
            shard: 1/3
          - part: motion 2/3
            shard: 2/3
          - part: motion 3/3
            shard: 3/3
    # GitHub's ceiling for a hosted job.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            SIL
            SIL/embsim
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO + protocol generator deps
        run: pip install --upgrade platformio pyyaml jinja2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's
      # sandbox uses (embsim's own chrome-cdp job does the same).
      - name: Let Chrome's sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Which Chrome
        run: google-chrome --version

      # The node's canary on this runner's Chrome, from the pinned embsim.
      - name: The node's Chrome canary (a worker on the board's clock)
        working-directory: SIL/embsim
        env:
          CHROME: /usr/bin/google-chrome
        run: >-
          cargo test -p embsim-cdp --test real_chrome --
          --ignored --nocapture --test-threads 1
          a_workers_four_millisecond_timer_ticks_once_every_four_grants

      # Install the platform before the first pio build: a fresh install
      # changes PlatformIO's project checksum, which cleans .pio/build.
      - name: Install the Propeller platform (flexcc/flexspin)
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      # The production image, laid out in the module's flash, and the card
      # (make flash-image sd-image), then `embsim check` on the eight project
      # files, which builds the embsim tool and mad-runner (--release: the
      # ISS interprets every P2 instruction).
      - name: The images, the runner and the project files (make check)
        working-directory: SIL
        env:
          CHROME: /usr/bin/google-chrome
        run: make check
      - name: Install Control deps + wasm + proto
        working-directory: Software/Control
        run: |
          npm ci
          npm run build:wasm
          npm run generate:proto
      # A1 and the FW scenarios launch a host Chrome (`channel: 'chrome'`);
      # this brings in the shared libraries Playwright's driver needs.
      - name: Install Chromium for Playwright
        if: matrix.part == 'suite'
        working-directory: Software/Control
        run: npx playwright install --with-deps chromium

      # `make e2e` starts the dev server, then for each scenario a fresh
      # board (`embsim run mad-cosim.toml`, its headless Chrome's DevTools
      # on 9222), waits for the run's "reached" line, runs that scenario
      # attached there, and stops the board. One board each, so the node's
      # occasional stall while the app's worker boots (ci.yml,
      # control-e2e-board) costs one scenario, not the rest of the night.
      - name: Run the suite on the project
        if: matrix.part == 'suite'
        working-directory: SIL
        env:
          CHROME: /usr/bin/google-chrome
          BOARD_LOGS: /tmp/e2e-out
          BOARD_PER_SCENARIO: '1'
          E2E_TIMINGS: /tmp/e2e-out/timings.json
        run: |
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          if [ "$SUITE" = "smoke" ]; then
            export SCENARIOS=$(grep -v -e '^#' -e '^[[:space:]]*$' ../Software/Control/e2e/smoke-ids.txt | paste -sd, -)
          fi
          make e2e

      # What the project as drawn cannot run (run-all.mjs, PROJECT_CANNOT),
      # on the board with MaD #285 fixed: `make e2e-motion` checks
      # mad-ic14-fixed-cosim.toml and runs this job's third of what
      # `run-all.mjs --list --cannot` names there, one board each. On the
      # smoke suite, the smoke ids among them.
      - name: 'Run the motion set on the board with IC14 fixed (MaD #285)'
        if: startsWith(matrix.part, 'motion')
        working-directory: SIL
        env:
          CHROME: /usr/bin/google-chrome
          BOARD_LOGS: /tmp/e2e-out/motion
          BOARD_PER_SCENARIO: '1'
          E2E_TIMINGS: /tmp/e2e-out/timings-motion.json
          MOTION_SHARD: ${{ matrix.shard }}
        run: |
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          if [ "$SUITE" = "smoke" ]; then
            export SCENARIOS=$(grep -v -e '^#' -e '^[[:space:]]*$' ../Software/Control/e2e/smoke-ids.txt | paste -sd, -)
          fi
          make e2e-motion

      # FW-ISS: the app's flasher against the ISS booting the mask ROM, on
      # the programming UART, on the project's serial boot (make e2e-rom).
      - name: Run FW-ISS on the project's serial boot
        if: ${{ always() && matrix.part == 'suite' }}
        working-directory: SIL
        env:
          CHROME: /usr/bin/google-chrome
          BOARD_LOGS: /tmp/e2e-out/rom
        run: make e2e-rom

      - name: Timings
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")).timings; } catch { return []; } };
            const timings = [...read("/tmp/e2e-out/timings.json"), ...read("/tmp/e2e-out/timings-motion.json")];
            if (timings.length === 0) process.exit(0);
            const rows = timings.map((r) => `| ${r.id} | ${r.verdict} | ${r.hostS.toFixed(1)} | ${r.boardS === null ? "–" : r.boardS.toFixed(3)} |`);
            const out = ["| scenario | verdict | host s | board s |", "|---|---|---|---|", ...rows].join("\n");
            console.log(out);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/e2e-out
          cp -r Software/Control/e2e/artifacts /tmp/e2e-out/scenario-artifacts 2>/dev/null || true
      - name: Upload logs + failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-board-${{ github.run_number }}-${{ strategy.job-index }}
          path: /tmp/e2e-out
          retention-days: 14
