# Nightly e2e on the board: the whole suite, on the route the per-PR
# `control-e2e-board` job (ci.yml) runs a subset of.
#
# ONE configuration, deliberately: the only one a browser belongs in. The
# shipped P2 image (propeller2_debug, compiled by flexcc) is interpreted by
# the ISS, and MaD Control runs in the runner's own Chrome, every page and
# dedicated worker held to the board's clock by embsim's `chrome-cdp` node
# (`mad-emulator --chrome`), its Web Serial port the board's protocol line.
# Every budget in the suite is board time; host time is printed, never
# asserted. No image, no VM.
#
# Not per-PR because a PR cannot afford it: the ISS runs at a few percent of
# real time, so the whole suite is hours of host time (PR #155 measured it
# locally). ci.yml is the source of truth for which jobs gate; do not infer
# it from here.
#
# The node's Chrome canary runs first: embsim-cdp's real-Chrome case in which
# a dedicated worker's 4 ms timer must tick once every four 1 ms grants. It
# fails if the runner's Chrome stops honouring virtual time on worker
# sessions (Chrome's `Emulation` on workers is undocumented), which would put
# the app's worker, and its 2 s response timeout, back on host time.
#
# WHAT STILL DOES NOT TOUCH THE BOARD: A1 and FW1/2/3/5/6/7/8/9 drive a host
# Chrome against in-page fakes (installFakeBootRom, installOpfsDataDir); they
# run here and in `control-e2e-boardless` alike. FW-ISS needs the ROM board
# (`mad-emulator --boot-rom --chrome`), which this job does not start.
#
# Use `workflow_dispatch` with suite=smoke to run e2e/smoke-ids.txt instead.

name: E2E nightly (ISS + chrome-cdp)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'full | smoke'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smoke

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    name: E2E on the ISS (FlexC image + chrome-cdp)
    runs-on: ubuntu-latest
    # GitHub's ceiling for a hosted job. The whole suite was about three hours
    # of host time locally (PR #155); a runner is slower.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Software/Control/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            SIL
            SIL/embsim
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO + protocol generator deps
        run: pip install --upgrade platformio pyyaml jinja2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's
      # sandbox uses (embsim's own chrome-cdp job does the same).
      - name: Let Chrome's sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Which Chrome
        run: google-chrome --version

      # The node's canary on this runner's Chrome, from the pinned embsim.
      - name: The node's Chrome canary (a worker on the board's clock)
        working-directory: SIL/embsim
        env:
          CHROME: /usr/bin/google-chrome
        run: >-
          cargo test -p embsim-cdp --test real_chrome --
          --ignored --nocapture --test-threads 1
          a_workers_four_millisecond_timer_ticks_once_every_four_grants

      # Install the platform before the first pio build: a fresh install
      # changes PlatformIO's project checksum, which cleans .pio/build.
      - name: Install the Propeller platform (flexcc/flexspin)
        working-directory: Firmware/MaDCore
        run: pio pkg install --platform https://github.com/RileyMcCarthy/platform-propeller.git
      - name: Build the P2 image the ISS interprets
        working-directory: Firmware/MaDCore
        run: pio run -e propeller2_debug
      # --release is not optional: the ISS interprets every P2 instruction.
      - name: Build mad-emulator (release)
        working-directory: SIL
        run: |
          make protocol
          cargo build --release --bin mad-emulator
      - name: Install Control deps + wasm + proto
        working-directory: Software/Control
        run: |
          npm ci
          npm run build:wasm
          npm run generate:proto
      # A1 and the FW scenarios launch a host Chrome (`channel: 'chrome'`);
      # this brings in the shared libraries Playwright's driver needs.
      - name: Install Chromium for Playwright
        working-directory: Software/Control
        run: npx playwright install --with-deps chromium

      # scripts/board-route.sh starts the dev server, then for each scenario
      # a fresh board with a headless Chrome on its clock (DevTools on 9222),
      # waits for the run's "reached" line, runs that scenario attached there,
      # and stops the board. One board each, so the node's occasional stall
      # while the app's worker boots (ci.yml, control-e2e-board) costs one
      # scenario, not the rest of the night.
      - name: Run the suite on the ISS
        working-directory: SIL
        env:
          CHROME: /usr/bin/google-chrome
          BOARD_LOGS: /tmp/e2e-out
          BOARD_PER_SCENARIO: '1'
          E2E_TIMINGS: /tmp/e2e-out/timings.json
        run: |
          SUITE="${{ github.event.inputs.suite || 'full' }}"
          if [ "$SUITE" = "smoke" ]; then
            export SCENARIOS=$(grep -v -e '^#' -e '^[[:space:]]*$' ../Software/Control/e2e/smoke-ids.txt | paste -sd, -)
          fi
          scripts/board-route.sh e2e

      - name: Timings
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let t; try { t = JSON.parse(fs.readFileSync("/tmp/e2e-out/timings.json", "utf8")); } catch { process.exit(0); }
            const rows = t.timings.map((r) => `| ${r.id} | ${r.verdict} | ${r.hostS.toFixed(1)} | ${r.boardS === null ? "–" : r.boardS.toFixed(3)} |`);
            const out = ["| scenario | verdict | host s | board s |", "|---|---|---|---|", ...rows].join("\n");
            console.log(out);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/e2e-out
          cp -r Software/Control/e2e/artifacts /tmp/e2e-out/scenario-artifacts 2>/dev/null || true
      - name: Upload logs + failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nightly-board-${{ github.run_number }}
          path: /tmp/e2e-out
          retention-days: 14
