name: SIL Tests

on:
  workflow_run:
    workflows: ["Build Software", "Build MaD Firmware"]
    types:
      - completed

env:
  # Common environment variables
  NODE_ENV: production
  CI: true
  DISPLAY: ':99'

jobs:
  sil-tests:
    # Only run if the triggering workflow completed successfully
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Get workflow run IDs for same commit
      id: get-runs
      run: |
        # Get the head SHA from the triggering workflow
        HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
        echo "Target commit SHA: $HEAD_SHA"
        echo "Triggering workflow: ${{ github.event.workflow_run.name }}"
        
        # Find successful runs for both workflows for this specific commit
        SOFTWARE_RUN=$(gh run list --workflow=software-build.yml --status=success --limit=20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -1)
        FIRMWARE_RUN=$(gh run list --workflow=firmware-build.yml --status=success --limit=20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -1)
        
        echo "Software run found: $SOFTWARE_RUN"
        echo "Firmware run found: $FIRMWARE_RUN"
        
        if [ -z "$SOFTWARE_RUN" ] || [ -z "$FIRMWARE_RUN" ]; then
          echo "⚠️  Could not find successful runs for both workflows at commit $HEAD_SHA"
          echo "This may be expected if one workflow hasn't completed yet."
          echo "Software run: ${SOFTWARE_RUN:-'Not found'}"
          echo "Firmware run: ${FIRMWARE_RUN:-'Not found'}"
          
          # Wait a bit and try again in case the other workflow is still running
          echo "Waiting 30 seconds for other workflow to potentially complete..."
          sleep 30
          
          SOFTWARE_RUN=$(gh run list --workflow=software-build.yml --status=success --limit=20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -1)
          FIRMWARE_RUN=$(gh run list --workflow=firmware-build.yml --status=success --limit=20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -1)
          
          if [ -z "$SOFTWARE_RUN" ] || [ -z "$FIRMWARE_RUN" ]; then
            echo "❌ Still could not find successful runs for both workflows at commit $HEAD_SHA"
            echo "Software run: ${SOFTWARE_RUN:-'Not found'}"
            echo "Firmware run: ${FIRMWARE_RUN:-'Not found'}"
            exit 1
          fi
        fi
        
        echo "software-run-id=$SOFTWARE_RUN" >> $GITHUB_OUTPUT
        echo "firmware-run-id=$FIRMWARE_RUN" >> $GITHUB_OUTPUT
        
        echo "✅ Found successful runs for commit $HEAD_SHA:"
        echo "  Software build: $SOFTWARE_RUN"
        echo "  Firmware build: $FIRMWARE_RUN"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Download Software Build Artifacts
      run: |
        echo "Downloading software artifacts from run ${{ steps.get-runs.outputs.software-run-id }}..."
        gh run download ${{ steps.get-runs.outputs.software-run-id }} --name "MaD-Control-${{ steps.get-runs.outputs.software-run-id }}" --dir ./software-artifacts/
      env:
        GH_TOKEN: ${{ github.token }}
        
    - name: Prepare software for testing
      run: |
        echo "Preparing software artifacts for testing..."
        
        # Look for AppImage (controlled by software workflow)
        if ls ./software-artifacts/*.AppImage 1> /dev/null 2>&1; then
          echo "✅ Found AppImage distribution"
          mkdir -p ./mad-control/
          cp ./software-artifacts/*.AppImage ./mad-control/
          chmod +x ./mad-control/*.AppImage
        else
          echo "❌ AppImage not found"
          ls -la ./software-artifacts/
          exit 1
        fi
        
        echo "✅ Software ready for testing:"
        ls -la ./mad-control/

    - name: Download Firmware Build Artifacts  
      run: |
        echo "Downloading firmware artifacts from run ${{ steps.get-runs.outputs.firmware-run-id }}..."
        gh run download ${{ steps.get-runs.outputs.firmware-run-id }} --name "MaD-Firmware-${{ steps.get-runs.outputs.firmware-run-id }}" --dir ./firmware-artifacts/
      env:
        GH_TOKEN: ${{ github.token }}
        
    - name: Prepare firmware for testing
      run: |
        echo "Preparing firmware artifacts for testing..."
        
        # Find the native firmware binary
        if ls ./firmware-artifacts/*-native.bin 1> /dev/null 2>&1; then
          mkdir -p ./firmware/
          cp ./firmware-artifacts/*-native.bin ./firmware/mad-firmware-native.bin
          chmod +x ./firmware/mad-firmware-native.bin
          echo "✅ Native firmware binary ready"
        else
          echo "❌ Native firmware binary not found"
          ls -la ./firmware-artifacts/
          exit 1
        fi
        
        echo "✅ Firmware ready for testing:"
        ls -la ./firmware/

    - name: Install system dependencies for testing
      run: |
        # Install Playwright browsers and Xvfb for headless testing
        sudo apt-get update && sudo apt-get install -y xvfb python3-venv

    - name: Setup Playwright for testing
      run: |
        cd ./Software/MaDControl
        # Install minimal dependencies needed for Playwright
        npm ci --omit=optional --ignore-scripts
        npx playwright install --with-deps

    - name: Setup firmware emulation environment
      run: |
        echo "Setting up firmware emulation environment using makefile..."
        cd Firmware/MaDCore/Emulation
        
        # Use makefile to setup Python virtual environment
        make venv
        
        echo "✅ Firmware emulation environment ready"

    - name: Start firmware emulation
      run: |
        echo "Starting firmware emulator with pre-built binary..."
        cd Firmware/MaDCore/Emulation
        
        # Set environment variable for prebuilt firmware
        export MAD_FIRMWARE_EXECUTABLE="$(pwd)/../../../firmware/mad-firmware-native.bin"
        
        # Start emulator using makefile (Server.py handles socat creation)
        nohup make run > /tmp/firmware-emulator.log 2>&1 &
        echo $! > /tmp/firmware.pid
        sleep 5
        
        # Check if emulator started successfully
        if kill -0 $(cat /tmp/firmware.pid 2>/dev/null) 2>/dev/null; then
          echo "✅ Firmware emulator started successfully"
        else
          echo "⚠️ Firmware emulator failed to start"
        fi
      continue-on-error: true

    - name: Run SIL tests with virtual display
      working-directory: ./Software/MaDControl
      env:
        MAD_CONTROL_DIST_PATH: ../../mad-control
      run: |
        # Start virtual display for headless testing
        Xvfb :99 -screen 0 1280x960x24 -ac &
        sleep 2
        
        # Run all Playwright tests with proper reporting and capture logs
        echo "Running Playwright SIL tests against pre-built artifacts..."
        npx playwright test --reporter=github,list 2>&1 | tee /tmp/playwright-test.log
        
        # Check test results and show summary
        if [ $? -eq 0 ]; then
          echo "✅ All Playwright tests passed successfully"
        else
          echo "❌ Some Playwright tests failed - check logs for details"
          exit 1
        fi

    - name: Collect test artifacts
      if: always()
      run: |
        # Create structured artifact directories
        mkdir -p ./artifacts/{Logs,Screenshots,TestResults}
        
        # Collect logs
        cp /tmp/firmware-emulator.log ./artifacts/Logs/ 2>/dev/null || echo "No firmware log found"
        cp /tmp/playwright-test.log ./artifacts/Logs/ 2>/dev/null || echo "No Playwright log found"
        
        # Collect screenshots from all test suites
        find ./Software/MaDControl/test-results/ -name "*.png" -exec cp {} ./artifacts/Screenshots/ \; 2>/dev/null || echo "No screenshots found"
        
        # Collect test results and traces
        find ./Software/MaDControl/test-results/ -name "*.zip" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No trace files found"
        find ./Software/MaDControl/test-results/ -name "*.html" -exec cp {} ./artifacts/TestResults/ \; 2>/dev/null || echo "No HTML reports found"
        
        # Show artifact summary
        echo "=== Test Artifacts Summary ==="
        echo "Logs: $(ls -1 ./artifacts/Logs/ 2>/dev/null | wc -l) files"
        echo "Screenshots: $(ls -1 ./artifacts/Screenshots/ 2>/dev/null | wc -l) files"
        echo "Test Results: $(ls -1 ./artifacts/TestResults/ 2>/dev/null | wc -l) files"

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sil-test-results-${{ github.run_number }}
        path: ./artifacts/
        retention-days: 30