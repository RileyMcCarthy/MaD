name: SIL Tests

on:
  workflow_run:
    workflows: ["Build Software", "Build MaD Firmware"]
    types:
      - completed
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/sil-tests.yml'
      - 'Software/MaDControl/tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/sil-tests.yml'
      - 'Software/MaDControl/tests/**'

env:
  # Common environment variables
  NODE_ENV: production
  CI: true
  DISPLAY: ':99'

jobs:
  sil-tests:
    # Only run if both workflows completed successfully, or if manually triggered
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Get latest workflow run IDs
      id: get-runs
      run: |
        # Get the latest successful runs for both workflows
        SOFTWARE_RUN=$(gh run list --workflow=software-build.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
        FIRMWARE_RUN=$(gh run list --workflow=firmware-build.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
        
        echo "software-run-id=$SOFTWARE_RUN" >> $GITHUB_OUTPUT
        echo "firmware-run-id=$FIRMWARE_RUN" >> $GITHUB_OUTPUT
        
        echo "Latest successful software build: $SOFTWARE_RUN"
        echo "Latest successful firmware build: $FIRMWARE_RUN"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Download Software Build Artifacts
      run: |
        echo "Downloading software artifacts from run ${{ steps.get-runs.outputs.software-run-id }}..."
        gh run download ${{ steps.get-runs.outputs.software-run-id }} --name "MaD-Control-${{ steps.get-runs.outputs.software-run-id }}" --dir /tmp/software-artifacts/
        
        # Extract and prepare the software for testing
        mkdir -p /tmp/mad-control/
        
        # Find and extract the Linux AppImage or other distributable
        if ls /tmp/software-artifacts/*.AppImage 1> /dev/null 2>&1; then
          echo "Found AppImage distribution"
          cp /tmp/software-artifacts/*.AppImage /tmp/mad-control/
        elif ls /tmp/software-artifacts/*.zip 1> /dev/null 2>&1; then
          echo "Found ZIP distribution"
          unzip /tmp/software-artifacts/*.zip -d /tmp/mad-control/
        else
          echo "No suitable distribution found"
          ls -la /tmp/software-artifacts/
          exit 1
        fi
        
        echo "✅ Software artifacts ready:"
        ls -la /tmp/mad-control/
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Download Firmware Build Artifacts  
      run: |
        echo "Downloading firmware artifacts from run ${{ steps.get-runs.outputs.firmware-run-id }}..."
        gh run download ${{ steps.get-runs.outputs.firmware-run-id }} --name "MaD-Firmware-${{ steps.get-runs.outputs.firmware-run-id }}" --dir /tmp/firmware-artifacts/
        
        # Find and prepare the native firmware binary
        mkdir -p /tmp/firmware/
        
        if ls /tmp/firmware-artifacts/*-native.bin 1> /dev/null 2>&1; then
          cp /tmp/firmware-artifacts/*-native.bin /tmp/firmware/mad-firmware-native.bin
          chmod +x /tmp/firmware/mad-firmware-native.bin
          echo "✅ Native firmware binary ready"
        else
          echo "❌ Native firmware binary not found"
          ls -la /tmp/firmware-artifacts/
          exit 1
        fi
        
        echo "✅ Firmware artifacts ready:"
        ls -la /tmp/firmware/
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Install system dependencies for testing
      run: |
        # Install Playwright browsers and Xvfb for headless testing
        sudo apt-get update && sudo apt-get install -y xvfb socat python3-venv

    - name: Setup Playwright for testing
      run: |
        cd ./Software/MaDControl
        # Install minimal dependencies needed for Playwright
        npm ci --omit=optional --ignore-scripts
        npx playwright install --with-deps

    - name: Setup firmware emulation environment
      run: |
        echo "Setting up firmware emulation environment..."
        
        # Copy emulation scripts from source code
        cp -r Firmware/MaDCore/Emulation /tmp/firmware/
        
        cd /tmp/firmware/Emulation
        
        # Setup Python virtual environment
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
        echo "✅ Firmware emulation environment ready"

    - name: Start firmware emulation
      run: |
        echo "Starting firmware emulator with pre-built binary..."
        cd /tmp/firmware/Emulation
        
        # Set environment variable for prebuilt firmware
        export MAD_FIRMWARE_EXECUTABLE="/tmp/firmware/mad-firmware-native.bin"
        
        # Start emulator using the pre-built native executable
        source venv/bin/activate
        nohup python3 Server.py > /tmp/firmware-emulator.log 2>&1 &
        echo $! > /tmp/firmware.pid
        sleep 5
        
        # Check if emulator started successfully
        if kill -0 $(cat /tmp/firmware.pid 2>/dev/null) 2>/dev/null; then
          echo "✅ Firmware emulator started successfully"
          # Check if virtual serial ports were created
          if [ -e "/tmp/tty.rpi_client" ]; then
            echo "✅ Virtual serial ports available at /tmp/tty.rpi_client"
          else
            echo "⚠️ Virtual serial ports not found"
          fi
        else
          echo "⚠️ Firmware emulator failed to start"
        fi
      continue-on-error: true

    - name: Run SIL tests with virtual display
      working-directory: ./Software/MaDControl
      env:
        MAD_CONTROL_DIST_PATH: /tmp/mad-control
      run: |
        # Start virtual display for headless testing
        Xvfb :99 -screen 0 1280x960x24 -ac &
        sleep 2
        
        # Run all Playwright tests with proper reporting and capture logs
        echo "Running Playwright SIL tests against pre-built artifacts..."
        npx playwright test --reporter=github,list 2>&1 | tee /tmp/playwright-test.log
        
        # Check test results and show summary
        if [ $? -eq 0 ]; then
          echo "✅ All Playwright tests passed successfully"
        else
          echo "❌ Some Playwright tests failed - check logs for details"
          exit 1
        fi

    - name: Collect test artifacts
      if: always()
      run: |
        # Create structured artifact directories
        mkdir -p /tmp/artifacts/{Logs,Screenshots,TestResults}
        
        # Collect logs
        cp /tmp/firmware-emulator.log /tmp/artifacts/Logs/ 2>/dev/null || echo "No firmware log found"
        cp /tmp/playwright-test.log /tmp/artifacts/Logs/ 2>/dev/null || echo "No Playwright log found"
        
        # Collect screenshots from all test suites
        find ./Software/MaDControl/test-results/ -name "*.png" -exec cp {} /tmp/artifacts/Screenshots/ \; 2>/dev/null || echo "No screenshots found"
        
        # Collect test results and traces
        find ./Software/MaDControl/test-results/ -name "*.zip" -exec cp {} /tmp/artifacts/TestResults/ \; 2>/dev/null || echo "No trace files found"
        find ./Software/MaDControl/test-results/ -name "*.html" -exec cp {} /tmp/artifacts/TestResults/ \; 2>/dev/null || echo "No HTML reports found"
        
        # Show artifact summary
        echo "=== Test Artifacts Summary ==="
        echo "Logs: $(ls -1 /tmp/artifacts/Logs/ 2>/dev/null | wc -l) files"
        echo "Screenshots: $(ls -1 /tmp/artifacts/Screenshots/ 2>/dev/null | wc -l) files"
        echo "Test Results: $(ls -1 /tmp/artifacts/TestResults/ 2>/dev/null | wc -l) files"

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sil-test-results-${{ github.run_number }}
        path: /tmp/artifacts/
        retention-days: 30