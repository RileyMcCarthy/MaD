version: 2
updates:
  # Frontend-only web control app (npm).
  - package-ecosystem: npm
    directory: /Software/MaDWasmControl
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # ProtoEmb runtime (Rust → WASM core).
  - package-ecosystem: cargo
    directory: /Protocol/ProtoEmb/runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
