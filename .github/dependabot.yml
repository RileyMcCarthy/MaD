version: 2
updates:
  # Frontend-only web control app (npm).
  - package-ecosystem: npm
    directory: /Software/MaDWasmControl
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # (The ProtoEmb runtime and embsim crates are dependabot-covered in their own
  # repos: github.com/RileyMcCarthy/protoemb, github.com/RileyMcCarthy/embsim.)

  # GitHub Actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
