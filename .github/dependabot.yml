version: 2
updates:
  # Frontend-only web control app (npm).
  # Majors for the toolchain stack are human-owned (careful staged upgrades):
  # TS / ESLint / Vite / Vitest / plugin-react / PWA / typescript-eslint / @types/node.
  # Group only patch+minor so Dependabot never opens another mega-major PR.
  - package-ecosystem: npm
    directory: /Software/Control
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plugin-pwa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # (The ProtoEmb runtime and embsim crates are dependabot-covered in their own
  # repos: github.com/RileyMcCarthy/protoemb, github.com/RileyMcCarthy/embsim.)

  # GitHub Actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
