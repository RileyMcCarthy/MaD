# The MaD tensile tester: the Edge carrier (mad-edge), the P2-EC32MB module
# seated in its socket J3 with MaD's instruction-set simulator as its
# processor (mad-p2iss), the module's card in its socket J301, the DS2
# force-gauge add-on (mad-ds2) on the force cable, the machine (mad-machine)
# on the carrier's connectors, and a host on a serial line (embsim
# MIGRATING-MAD.md sections 1 and 4).
#
# Seven files share every line but how the module boots, which host sits
# where, and one stop; mad-catalog/tests/projects.rs holds them to it:
#
#   file                             the module boots        the host
#   mad.toml                         the firmware off flash  host-serial on J4
#   mad-cosim.toml                   the firmware off flash  chrome-cdp on J4
#   mad-playground.toml              that file, its Chrome headed on the app
#   mad-hard-stop-cosim.toml         mad-cosim.toml with a hard stop, one
#                                    option of the machine's
#   mad-serial-boot.toml             the ROM's serial boot,  host-serial on J1
#                                    its flash erased
#   mad-serial-boot-cosim.toml       the ROM's serial boot   chrome-cdp on J1
#   mad-serial-boot-playground.toml  that file, its Chrome headed on the app
#
# Every file takes the carrier as drawn: the Edge carrier v0.3 schematic
# (mad-catalog/netlists/mad_edge.net, its header says what it holds). The
# e2e runs mad-cosim.toml, the scenarios that move the carriage with the
# rest, and mad-hard-stop-cosim.toml for SERVO-stall, which drives the
# carriage into its stop; the playgrounds are for a person (SIL/makefile).
#
# The machine has two serial ports, and each file puts its host on the one
# its boot talks on. The firmware, one image (pio env MaD), has its
# protocol, the MAIN channel, on P30/P32 at 2 000 000 baud, which the
# isolator IC2 carries to and from the carrier's control port J4, where the
# machine's FTDI adapter sits: the flash-boot files' host is there. J1, the
# carrier's debug header, is the programming port, where the Prop Plug
# sits: the chip's P62/P63, where the ROM's serial loader listens and the
# firmware writes its log. The serial-boot files' host is there, as the
# app's flasher is. The protocol stays off J1 because the Prop Plug's DTR
# resets the chip whenever a port is opened on it (read: Firmware/MaDCore/
# platformio.ini, env MaD; src/HAL/Include/HW_pins.h, HW_PIN_MAIN_RX/TX and
# HW_PIN_DEBUG_RX/TX; mad_edge.net, IC2 on P29-P32 and J4).
#
#   cd SIL && make flash-image sd-image check
#
# Every supply, strap, jumper and wire is an entry of its own with its
# reason. Net names are the netlists' (mad-catalog/netlists/); "read" marks
# what was read off a netlist or a file, "inferred" what follows from one.

requires-embsim = "0.4"

[catalog]
crates = ["mad-catalog"]
runner = "mad-runner"

# ---- The boards -------------------------------------------------------------

[[board]]
name = "EDGE"
kind = "mad-edge"

[[board]]
name = "EC32"
kind = "p2-ec32mb"

# The processor: MaD's instruction-set simulator in the P2's package. Its
# ROM boots whatever the board gives it, as S301 sets the boot (the
# scenario, below).
[[board.model]]
value = "P2X8C4M64P"
kind = "p2"
[board.model.options]
core = "mad-p2iss"

# The module's flash, holding embsim's stage-1 and the firmware's program
# (pio env MaD) as `make flash-image` lays them out: the ROM boots the
# firmware off it. Its MAIN channel receives on P30 and transmits on P32 at
# 2 000 000 baud (Firmware/MaDCore/src/HAL/Include/HW_pins.h,
# HW_PIN_MAIN_RX/TX), IC2's link to the control port J4 (read:
# mad_edge.net, nets P30 and P32: IC2's OUTC and INA), and its log is on
# P62, J1's.
[[board.model]]
value = "SPI Flash 16MB (128Mb)"
kind = "w25q128jv"
[board.model.options]
pins = "by-function"
image = "build/flash.bin"

# The card in the module's socket J301: the 32 MiB FAT16 card `make sd-image`
# writes, ./sd mirrored onto it when it is there.
[[board.model]]
value = "MicroSD Socket"
kind = "sd-card"
[board.model.options]
pins = "by-function"
image = "build/sd.img"

[[board]]
name = "DS2"
kind = "mad-ds2"

# ---- The machine ------------------------------------------------------------

# The servo drive and its ready output, the encoder, the end switches, the
# door and the emergency stops, the gantry, the sample and the load cell:
# one plant (SIL/mad-catalog/src/machine.rs). The loops take the carrier's
# 5V_IO, so the kind has no loop supply of its own.
[[component]]
name = "MACHINE"
kind = "mad-machine"
[component.options]
sample = "sil-linear-reference"
# rs422, the default: each channel a pair, what J20 and U25 are designed
# for. npn-open-collector is the machine's real encoder (a Taiss 600 P/R),
# which the carrier reads with JP2 and JP3 closed (R40 and R41 pull the +
# legs up); mad-catalog/tests/mad.rs runs that case.
encoder_output = "rs422"

# ---- The host ---------------------------------------------------------------

# The host's Chrome on the serial line (embsim PROJECTS.md section 5,
# chrome-cdp): every page and dedicated worker held to the board's clock
# over DevTools, a 1 ms quantum at a time, its Web Serial port this line, on
# host-serial's four pins. At the firmware's protocol rate, the MAIN
# channel's 2 000 000 baud (the boards, above). Nothing starts at `embsim
# check`; `embsim run` launches Chrome headed (below) at the node's first
# slice and prints where its DevTools are. The DevTools port is fixed so the
# e2e's CDP_URL holds; the port is granted to every origin, as the board
# route grants it today (--granted, SIL/scripts/board-route.sh). Its USB
# ids, 0403:6001, are an FTDI FT232R's, the chip in the machine's
# control-port adapter on J4 (the bench's FTDI adapter, A5069RR4): the ids
# the app knows its control port by and the e2e expects on this board (read:
# Software/Control/src/device/controlPort.test.ts, FT232R; e2e/fixtures.mjs,
# E2E_PORT_USB).
[[component]]
name = "HOST"
kind = "chrome-cdp"
[component.options]
baud = 2000000
devtools_port = 9222
granted = true
usb_vendor_id = 0x0403
usb_product_id = 0x6001
# For a person (make playground): Chrome headed, a window on the app, which
# the makefile serves from the host (Software/Control's dev server, on
# 5174). mad-cosim.toml launches it headless with no page open.
headless = false
url = "http://127.0.0.1:5174/"

# ---- The module in its socket, and the force cable --------------------------

# Both netlists number the 80-way card edge by finger, so each finger the
# module has lands on the socket contact of its number. The module has no
# finger behind contacts 55, 56, 59-67 and 69-77 (P40-P57, V40, V48): it
# keeps those pins for its PSRAMs (read: embsim boards/netlists/
# p2_ec32mb.net, its header's no-connects).
[[mate]]
a = "EC32.J203"
b = "EDGE.J3"

# The carrier's six-way J9 to the add-on's five-way J1, crossed: the
# carrier's IFG_TX (J9.4) reaches the converter's RX on J1.3, and its TX
# comes back on J1.4 to IFG_RX (J9.2). J9.6, the shield, has no pin on the
# add-on.
[[mate]]
a = "EDGE.J9"
b = "DS2.J1"
map = [["1", "1"], ["5", "2"], ["4", "3"], ["2", "4"], ["3", "5"]]

# ---- Supplies ---------------------------------------------------------------

# The machine's 12 V on the carrier's input J2. The carrier makes +5V and
# +3.3V from it (two XL1509 bucks behind the polarity FET U3), and the
# module takes its 5 V from +5V through the socket's 5V fingers.
[[wire]]
from = "BENCH.12V"
to = "EDGE.J2.1"
volts = 12.0

# Its return. No ground is implicit (embsim DESIGN.md rule 6).
[[wire]]
from = "BENCH.GND"
to = "EDGE.J2.2"
volts = 0.0

# SC_5V, the servo side's 5 V: IC14's isolated side (VCC2), the line driver
# U24, the line receiver U25, IC16's primary (VCC1), R25, the ready
# output's pull-up, R40-R42, the encoder's A+, B+ and Z+ pull-ups, and R43,
# the top of ENC_REF's divider. Nothing on the carrier makes it (read: mad_edge.net;
# embsim board/tests/edgeboard.rs, the domains a bare carrier reports), so
# it comes in on J21; that the drive's cable brings it is inferred.
[[wire]]
from = "BENCH.SERVO5V"
to = "EDGE.J21.1"
volts = 5.0

# EN_GND, the servo side's return, on J21.8 (J21.9, J20.5 and J25.3 are the
# same net, and so are IC14's side-2 ground pins).
[[wire]]
from = "BENCH.SERVOGND"
to = "EDGE.J21.8"
volts = 0.0

# GND_IO, the isolated I/O domain's return: IC3, the isolated DC/DC that
# makes 5V_IO, measures its output against it, and nothing on the carrier
# ties it to a voltage, so without this 5V_IO stays down and the switch
# loops have no supply (embsim board/tests/edgeboard.rs, the isolated
# returns a harness ties down). J10.2 is a GND_IO pin, as J5.3-J8.3 are.
[[wire]]
from = "BENCH.IOGND"
to = "EDGE.J10.2"
volts = 0.0

# IFG_GND, the isolated force domain's return, the same case: IC4 makes
# IFG_5V, which reaches the add-on over the cable as its +3V3 net, against
# a return nothing on either board ties down.
[[wire]]
from = "BENCH.IFGGND"
to = "DS2.J1.2"
volts = 0.0

# The add-on's analog supply AVDD and its return, brought out on J2 and
# made by neither board. On the machine the DS2 gauge supplies them over J2
# (read: Hardware/DS2Addon/readme.md, "Bench testing"); mad-machine's load
# cell senses its excitation and sources nothing (mad-catalog/src/
# machine.rs), so this bench supply stands in for the gauge's. 3.3 V is the
# readme's bench-strap level, not a level measured on the gauge. The load
# cell's excitation is this supply (the machine's E+ and E-, below).
[[wire]]
from = "BENCH.VDDA"
to = "DS2.J2.1"
volts = 3.3

[[wire]]
from = "BENCH.AGND"
to = "DS2.J2.2"
volts = 0.0

# No bench supply on J4, the control port: IC2's side on it (RPI_3V3, its
# VCC2, and RPI_GND, its GND2) takes its power from whatever is plugged into
# J4, a Raspberry Pi or a USB adapter, and nothing on the carrier ties
# RPI_GND to a voltage (read: mad_edge.net, IC2's note). Each file's host's
# wires (below) power that side where its host sits on J4, and leave it
# unpowered, as with nothing plugged in, where its host sits on J1.

# ---- The host's wires -------------------------------------------------------

# The host on the carrier's control port J4, where the machine's FTDI
# adapter sits, through the isolator IC2, an ISO6742DWR (read:
# mad_edge.net, IC2 and nets P30, P32, RPI_RX, RPI_TX, RPI_3V3 and
# RPI_GND). J4.3, RPI_RX, is IC2's input INC, whose output OUTC is P30, the
# chip's receive pin: what the host sends. J4.2, RPI_TX, is IC2's output
# OUTA, from its input INA on P32, the chip's transmit pin: the firmware's
# answers. J4.1, RPI_3V3, is IC2's side-2 supply VCC2, and J4.6, RPI_GND,
# its side-2 ground GND2 (pins 9 and 15). J4.4 and J4.5 (RPI_GPO, IC2's
# OUTB from P31, and RPI_GPI, its IND to P29) and J4.7 (SHIELD) stay
# unwired: the adapter brings a transmit line, a receive line, a supply and
# a ground. IC2's enables, EN1 and EN2, are unconnected in the drawing, and
# the part reads an open enable as enabled (embsim's iso67xx model, its
# function table).
#
# The debug header J1 stays unwired: it is the programming port, P62/P63,
# where the firmware writes its log and the ROM's serial loader listens.
# Nothing here flashes the firmware or reads its log, and nothing pulses
# J1.3, RESn: the flash boot runs from power-up.

# The adapter's I/O rail, 3.3 V: the host's pins, and IC2's side on J4.
[[wire]]
from = "ADAPTER.3V3"
to = "HOST.VIO"
volts = 3.3

# RPI_3V3, IC2's VCC2, on the same rail: one source, one voltage (embsim
# PROJECTS.md section 6).
[[wire]]
from = "ADAPTER.3V3"
to = "EDGE.J4.1"

# RPI_GND, IC2's side-2 return, which nothing on the carrier ties to a
# voltage: the adapter's 0 V, as the bench ties GND_IO and IFG_GND (the
# supplies, above).
[[wire]]
from = "ADAPTER.GND"
to = "EDGE.J4.6"
volts = 0.0

# The host's ground, RPI_GND, on J4.6.
[[wire]]
from = "HOST.GND"
to = "EDGE.J4.6"

# RPI_RX, IC2's INC to OUTC, P30: what the host sends.
[[wire]]
from = "HOST.TX"
to = "EDGE.J4.3"

# RPI_TX, IC2's OUTA from INA, P32: what the host receives.
[[wire]]
from = "EDGE.J4.2"
to = "HOST.RX"

# ---- The machine on the carrier's connectors --------------------------------

# SC_PUL+, the step pair's + leg from the line driver U24 (IC14's OUTA, from
# P8).
[[wire]]
from = "EDGE.J21.2"
to = "MACHINE.STEP"

# SC_DIR+, from U24 (IC14's OUTB, from P7).
[[wire]]
from = "EDGE.J21.5"
to = "MACHINE.DIR"

# No wire on J21.3 or J21.4 (SC_PUL- and SC_DIR-, U24's complementary
# outputs): the kind reads STEP and DIR single-ended against DRIVE_GND
# (mad-catalog/src/machine.rs, its DRIVE_GND reference).

# SC_ENA, from JP1's common pad (IC14's OUTC, from P6, with JP1 on pads
# 1-2: the scenario, below).
[[wire]]
from = "EDGE.J21.7"
to = "MACHINE.ENA"

# SC_SRDY: R25's pull-up to SC_5V, and IC14's input IND, which reaches P5.
[[wire]]
from = "MACHINE.SRDY"
to = "EDGE.J21.6"

# EN_GND, the return the drive reads its inputs against.
[[wire]]
from = "EDGE.J21.9"
to = "MACHINE.DRIVE_GND"

# A+, A-, B+ and B-: the encoder's pairs into the line receiver U25, whose
# 1Y and 2Y reach P9 and P10 through the isolator IC16.
[[wire]]
from = "MACHINE.ENC_A+"
to = "EDGE.J20.1"

[[wire]]
from = "MACHINE.ENC_A-"
to = "EDGE.J20.2"

[[wire]]
from = "MACHINE.ENC_B+"
to = "EDGE.J20.3"

[[wire]]
from = "MACHINE.ENC_B-"
to = "EDGE.J20.4"

# EN_GND, the encoder's declared return.
[[wire]]
from = "MACHINE.ENC_GND"
to = "EDGE.J20.5"

# No wire on Z+, Z-, ZI+ or ZI- (J20.7-J20.10), U25's fourth and third
# pairs: the machine's encoder has no index. An open pair rests at U25's
# own input bias, its fail-safe high; R42 pulls Z+ up to SC_5V besides.

# The switch loops. Each loop's pin 2 is its + (the current regulator's
# anode), pin 1 its - (the opto LED's cathode); the carrier powers no loop.
# Each contact's COM takes the carrier's 5V_IO (IC3's isolated output, on
# J5.1-J8.1) and each loop's - returns to GND_IO (J5.3-J8.3), carrier pin
# to carrier pin; J5's two pins stand for the nets. The loops follow the
# nets, not the silkscreen (read: mad_edge.net).

# The upper end switch, IEND_U (J16): P19, through IC9 and U6.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.UPPER_COM"

[[wire]]
from = "MACHINE.UPPER+"
to = "EDGE.J16.2"

[[wire]]
from = "EDGE.J16.1"
to = "EDGE.J5.3"

# The lower end switch, IEND_L (J15): P20.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.LOWER_COM"

[[wire]]
from = "MACHINE.LOWER+"
to = "EDGE.J15.2"

[[wire]]
from = "EDGE.J15.1"
to = "EDGE.J5.3"

# The door, IDOOR (J14): P21.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.DOOR_COM"

[[wire]]
from = "MACHINE.DOOR+"
to = "EDGE.J14.2"

[[wire]]
from = "EDGE.J14.1"
to = "EDGE.J5.3"

# The upper emergency stop, IESD_U (J11): P16.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.ESD_U_COM"

[[wire]]
from = "MACHINE.ESD_U+"
to = "EDGE.J11.2"

[[wire]]
from = "EDGE.J11.1"
to = "EDGE.J5.3"

# The lower emergency stop, IESD_L (J12): P17.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.ESD_L_COM"

[[wire]]
from = "MACHINE.ESD_L+"
to = "EDGE.J12.2"

[[wire]]
from = "EDGE.J12.1"
to = "EDGE.J5.3"

# The emergency-stop switch, IESD_A (J13): P18.
[[wire]]
from = "EDGE.J5.1"
to = "MACHINE.ESD_A_COM"

[[wire]]
from = "MACHINE.ESD_A+"
to = "EDGE.J13.2"

[[wire]]
from = "EDGE.J13.1"
to = "EDGE.J5.3"

# Nothing at rest shows the three emergency stops' wires: a stop rests open,
# an open loop and an unwired one both leave P16-P18 on their pull-ups to
# VIO_16_23 (R5, R1, R6; read: mad_edge.net), and the kind cannot press a
# stop (mad-catalog/src/machine.rs, "Not modelled"). No case in
# mad-catalog/tests/mad.rs checks them.

# The emergency-stop circuit's power, GPI_3 (J17): P22, through the current
# regulator IC12 and U8's first channel, with R8's 1 kOhm pull-up to
# VIO_16_23, the parts and the pattern of the switch loops above (read:
# mad_edge.net). The firmware reads P22 high as ESD_POWER, the emergency-stop
# circuit without power, and holds the machine faulted with motion refused
# while it lasts (read: Firmware/MaDCore/src/HAL/Config/HAL_GPIO_config.c,
# ESD_POWER active high; src/APP/app_control.c, processFaults; docs/
# user-guide/machine-states.md), so the loop carries current while that
# circuit has power. The kind has no emergency-stop circuit (mad-catalog/src/
# machine.rs), and what the machine has on J17 is not confirmed on the
# board: the loop is closed from the carrier's 5V_IO to GND_IO, as the
# switch loops take them, standing for a circuit with its power (inferred).
# With nothing on J17, P22 rests high on R8 and every state read answers
# ESD_POWER (measured, mad-catalog/tests/mad.rs).
[[wire]]
from = "EDGE.J5.1"
to = "EDGE.J17.2"

[[wire]]
from = "EDGE.J17.1"
to = "EDGE.J5.3"

# The bridge's excitation, sensed: the add-on's AVDD and its return.
[[wire]]
from = "MACHINE.E+"
to = "DS2.J2.1"

[[wire]]
from = "MACHINE.E-"
to = "DS2.J2.2"

# The bridge's outputs: A0 and A1, to the converter's AIN0 and AIN1 through
# the add-on's JP1 and JP2.
[[wire]]
from = "MACHINE.S+"
to = "DS2.J2.3"

[[wire]]
from = "MACHINE.S-"
to = "DS2.J2.4"

# ---- Scenario ---------------------------------------------------------------

# S301 position 2, FLASH: P61 reaches the flash's chip select.
[[switch]]
part = "EC32.S301"
pole = 1
state = "closed"

# S301 position 4: R303 holds P59 down, so the ROM boots the program in
# flash. Position 3, R302's pull-up, stays open.
[[switch]]
part = "EC32.S301"
pole = 3
state = "closed"

# JP1, TTL-SINK, on pads 1-2 (A-C), its default: SC_ENA from IC14's TTL
# output OUTC. Pads 2-3 (B-C) put SC_ENA on Q1's open collector instead,
# which OUTC switches through R24. The firmware drives the enable pin P6,
# active high, from the servo loop on the MOTOR cog: low from start-up and
# whenever motion is disabled, high while it is enabled
# (Firmware/MaDCore/src/DEV/dev_servo.c, dev_servo_private_applyEnable), so
# OUTC follows P6 onto SC_ENA. The drive's enable is energized = enabled
# (ENA high enables; the machine's owner, 2026-10-25), which the machine's
# kind models (mad-catalog/src/machine.rs). Which pads the machine's carrier
# has closed is not confirmed on the board. To flip it, change this entry's
# pole to 1.
[[switch]]
part = "EDGE.JP1"
pole = 0
state = "closed"

# JP2, JP3, JP6 and JP5 (A_REF, B_REF, Z_REF, ZI_REF) stay open: they tie
# A-, B-, Z- and ZI- to ENC_REF, half of SC_5V (R43, R44), for a
# single-ended or open-collector encoder, and the machine's encoder drives
# both legs of each pair (encoder_output = "rs422"). U25's enables are tied
# on in the drawing (G to SC_5V, ~G to EN_GND), so no jumper sets them.

# The add-on's JP1 and JP2: the bridge's A0 and A1 to the converter's AIN0
# and AIN1 (R6 and R7, the alternative, are not fitted).
[[jumper]]
part = "DS2.JP1"
state = "closed"

[[jumper]]
part = "DS2.JP2"
state = "closed"

# No strap on the converter's ~RESET: the add-on's netlist has R10, the
# 10 kOhm pull-up from U1's ~RESET (pin 3) to +3V3, which reads it high
# with no strap. A board made before R10 floats ~RESET
# (Hardware/DS2Addon/readme.md) and takes a bodge wire to +3V3 (U1's DVDD,
# pin 13):
#   [[pin_short]] a = "DS2.U1.3", b = "DS2.U1.13"
