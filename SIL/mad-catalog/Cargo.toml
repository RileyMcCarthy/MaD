# mad-catalog: the kinds MaD adds to embsim (embsim PROJECTS.md §10), started
# by `embsim new --catalog mad-catalog --own-runner`. A project names it in its
# [catalog] crates, and mad-runner, beside it, is the embsim command over it.
[package]
name = "mad-catalog"
description = "MaD's own embsim kinds: the Edge carrier and the DS2 force-gauge add-on as board kinds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# One copy of embsim: the pinned submodule, by path. The runner takes
# embsim-cli from the same checkout, and SIL/Cargo.lock locks the rest.
embsim-board = { path = "../embsim/board" }
embsim-boards = { path = "../embsim/boards" }
# The virtual clock. Nothing in src/ uses it yet: the tests hold its stepped
# clock across a build, as `embsim check` does, and the core and machine
# kinds of migration step 8 run on it (embsim MIGRATING-MAD.md section 3).
embsim-core = { path = "../embsim/core" }

[dev-dependencies]
# The tests run MaD's projects as the runner does, in process.
embsim-cli = { path = "../embsim/cli" }
rstest.workspace = true
vibes-behaviour = { path = "../../Vibes/bindings/rust" }
