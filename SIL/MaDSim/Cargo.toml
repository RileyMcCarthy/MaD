[package]
name = "mad-emulator"
version = "0.1.0"
edition = "2021"
description = "MaD Tensile Testing Machine — SIL emulator"

[dependencies]
embsim-core = { path = "../embsim/core" }
embsim-peripherals = { path = "../embsim/peripherals" }
embsim-p2 = { path = "../embsim/platforms/p2" }
embsim-models = { path = "../embsim/models" }
embsim-memory-inspect = { path = "../embsim/tools/memory-inspect" }
embsim-trace = { path = "../embsim/tools/trace" }
embsim-ui = { path = "../embsim/tools/ui" }
nix = { version = "0.29", features = ["term", "fs"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
# No build-dependencies — firmware is pre-built by PlatformIO
# (pio run -e native_emulator)
