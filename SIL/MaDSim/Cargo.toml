[package]
name = "mad-emulator"
version.workspace = true
edition.workspace = true
description = "MaD Tensile Testing Machine — SIL emulator"
publish = false

[dependencies]
embsim-core = { path = "../embsim/core" }
embsim-board = { path = "../embsim/board" }
embsim-models = { path = "../embsim/models" }
# The host's Chrome on the link, metered by the board's clock (`--chrome`):
# the `chrome-cdp` kind, built through its catalog.
embsim-cdp = { path = "../embsim/cdp" }
libc = "0.2"
models = { path = "../models" }
p2core = { path = "../p2core" }
p2iss = { path = "../p2iss" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
vibes-behaviour = { path = "../../Vibes/bindings/rust" }
