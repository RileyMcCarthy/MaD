[workspace]
members = [
    # Generic, reusable embsim library
    "embsim/core",
    "embsim/peripherals",
    "embsim/platforms/p2",
    "embsim/models",
    "embsim/runtime",
    "embsim/build-support",
    "embsim/tools/memory-inspect",
    "embsim/tools/ui",
    "embsim/tools/trace",
    "embsim/examples/minimal",
    # MaD-specific consumer side
    "mad-protocol",
    "embsim-mad-models",
    "MaDSim",
]
resolver = "2"

# Shared package metadata for the reusable embsim crates. A crate opts in with
# `version.workspace = true`, `license.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rileymccarthy/MaD"

# Centralized external dependency versions to prevent drift across crates.
[workspace.dependencies]
nix = { version = "0.29" }
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
libc = "0.2"
object = "0.36"
gimli = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
