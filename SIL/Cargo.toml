[workspace]
members = [
    # Out-of-tree member: the generated Rust protocol codec lives next to the
    # schema it comes from (see Protocol/Cargo.toml's `workspace` back-pointer).
    "../Protocol/rust",
    "models",
    "p2core",
    "p2iss",
    "MaDSim",
    # MaD's own embsim kinds, and the runner that is the embsim command over
    # them (embsim PROJECTS.md §10, "A runner the project owns"); a project
    # file names both in its [catalog].
    "mad-catalog",
    "mad-runner",
]
# The generic embsim library is a git submodule with its own workspace root
# (https://github.com/RileyMcCarthy/embsim). Its crates are consumed as path
# dependencies (see MaDSim/Cargo.toml) — path deps across a workspace boundary
# are fine, but the directory must be excluded so cargo doesn't treat the
# nested workspace as part of this one.
exclude = ["embsim"]
resolver = "2"

# Shared package metadata for the MaD-side crates. A crate opts in with
# `version.workspace = true`, `license.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rileymccarthy/MaD"

# Centralized external dependency versions to prevent drift across crates.
# (The embsim submodule centralizes its own in embsim/Cargo.toml.)
[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
rstest = "0.26"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }

# The ISS interprets hundreds of millions of guest instructions in every test
# that boots the firmware, on embsim's engine, and unoptimized both are several
# times slower: the dev-profile suite (CI's sil-rust and Behaviour ledger jobs)
# then rides its time budget, and a slow runner tips it over. The interpreter,
# its board adapter and every dependency (embsim among them) build optimized in
# dev; the test code itself does not, and overflow checks and debug info stay
# on throughout.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.p2core]
opt-level = 3

[profile.dev.package.p2iss]
opt-level = 3
