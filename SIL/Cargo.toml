[workspace]
members = [
    # Out-of-tree member: the generated Rust protocol codec lives next to the
    # schema it comes from (see Protocol/Cargo.toml's `workspace` back-pointer).
    "../Protocol/rust",
    "models",
    "p2core",
    "MaDSim",
]
# The generic embsim library is a git submodule with its own workspace root
# (https://github.com/RileyMcCarthy/embsim). Its crates are consumed as path
# dependencies (see MaDSim/Cargo.toml) — path deps across a workspace boundary
# are fine, but the directory must be excluded so cargo doesn't treat the
# nested workspace as part of this one.
exclude = ["embsim"]
resolver = "2"

# Shared package metadata for the MaD-side crates. A crate opts in with
# `version.workspace = true`, `license.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rileymccarthy/MaD"

# Centralized external dependency versions to prevent drift across crates.
# (The embsim submodule centralizes its own in embsim/Cargo.toml.)
[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
