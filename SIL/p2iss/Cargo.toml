[package]
name = "p2iss"
description = "The P2 instruction-set simulator as the core of embsim's P2 package"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
p2core = { path = "../p2core" }
embsim-board = { path = "../embsim/board" }
embsim-core = { path = "../embsim/core" }
# The P2 package the ISS sits in as a core (`P2IssCore`): its pads, bank
# supplies, START gate and crystal.
embsim-boards = { path = "../embsim/boards" }
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
# The module's flash, card, rails and Prop Plug in the tests' systems.
embsim-models = { path = "../embsim/models" }
# `iss_speed`'s CPU time and load average.
libc = "0.2"
# The host side of the protocol tests parses the firmware's replies with the
# same framing layer the app's runtime uses.
protoemb-framing = { path = "../../Protocol/ProtoEmb/framing" }
vibes-behaviour = { path = "../../Vibes/bindings/rust" }
